const CC_INST = { type:'addon', rate:1, min:0, max:1, term:12, terms:'3–60 months',
  note:'Installment, balance conversion and balance transfer plans are capped by the BSP at a 1% monthly add-on rate. Many banks charge less (0.5%–0.99%) or run 0% promos, so use the rate on your conversion slip.' };
function debtModal(id){
  const d = id ? S.debts.find(x=>x.id===id) : null;
  const st = d ? {...d, ...(d.type==='revolving'?{balance: Math.round(debtFacts(d).remaining*100)/100}:{})} : { lender:'gcash', product:'gloan', type:'addon', rate:3.5, principal:'', term:12, paidMonths:0, dueDay:'', nickname:'', balance:'', payment:'', limit:'', instRate:1 };
  let plan = d ? (d.plan || (d.lender==='cc' && d.type==='addon' ? 'installment' : 'balance')) : 'balance';
  let rateTouched = !!d;
  const lenderOpts = Object.entries(LENDERS).map(([k,L])=>`<option value="${k}" ${st.lender===k?'selected':''}>${esc(L.label)}</option>`).join('');
  openModal(`${mhead(d?'Edit debt':'Add a debt')}
    <form id="dForm" style="display:flex;flex-direction:column;gap:14px" autocomplete="off">
      <div class="grid-form">
        <label class="field">Lender<select class="input" id="dLender">${lenderOpts}</select></label>
        <label class="field" id="dCardFind" hidden style="grid-column:1/-1">Find your card<input class="input" id="dCardQ" type="search" placeholder="Type a bank or card, e.g. BPI Rewards"></label>
        <label class="field" id="dProdWrap"><span id="dProdLabel">Product</span><select class="input" id="dProd"></select></label>
      </div>
      <div id="dPlanWrap" hidden style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:.82rem;font-weight:600;color:var(--ink-2)">What do you owe on this card?</span>
        <div class="seg" id="dPlan">
          <button type="button" data-plan="balance">Unpaid balance</button>
          <button type="button" data-plan="installment">Installment / conversion</button>
          ${d?'':'<button type="button" data-plan="both">Both</button>'}
        </div>
        <span class="hint" id="dPlanHint"></span>
      </div>
      <label class="field"><span id="dNickLbl">Nickname <span class="hint">optional, e.g. "BPI Amore card"</span></span><input class="input" id="dNick" value="${esc(st.nickname||'')}"></label>
      <div class="rate-box">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><strong id="dRateLabel">Monthly rate</strong><span class="chip good" id="dAuto">${ico('check','style="width:12px;height:12px"')} Auto-filled</span></div>
        <div class="input-wrap" style="max-width:200px"><input class="input num" id="dRate" style="padding-left:12px;background:var(--surface)" inputmode="decimal" value="${st.rate}"><span class="suffix">% / month</span></div>
        <div class="src" id="dNote"></div>
      </div>
      <div id="dFields"></div>
      <div class="calc" id="dCalc"></div>
      <div class="modal-foot">${d?`<button type="button" class="btn danger ghost" data-act="del-debt" data-id="${d.id}" style="margin-right:auto">${ico('trash')}Delete</button>`:''}<button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">${d?'Save changes':'Add debt'}</button></div>
    </form>`, m=>{
    const $m = s=>m.querySelector(s);
    const baseProd = ()=> { const L=LENDERS[$m('#dLender').value]; return L.products[$m('#dProd').value] || Object.values(L.products)[0]; };
    const isCardPlan = ()=> $m('#dLender').value==='cc' && $m('#dProd').value!=='installment';
    const mode = ()=> isCardPlan() ? plan : (baseProd().type==='schedule' ? 'schedule' : baseProd().type==='addon' ? 'installment' : 'balance');
    let schedCtl = null;
    // product that drives the main rate box
    const prodOf = ()=> isCardPlan() && plan==='installment' ? CC_INST : baseProd();
    function fillProducts(keep){
      const lk=$m('#dLender').value, L=LENDERS[lk]; const isCC = lk==='cc';
      const q = isCC ? $m('#dCardQ').value.trim().toLowerCase() : '';
      let keys=Object.keys(L.products);
      if (isCC) keys = keys.filter(k=>k!=='installment' || (d && d.product==='installment'));
      if (q){ const words=q.split(/\s+/); keys = keys.filter(k=>{ const p=L.products[k], hay=(p.label+' '+(p.group||'')).toLowerCase(); return words.every(w=>hay.includes(w)); }); }
      const opt = k => `<option value="${k}" ${keep===k?'selected':''}>${esc(L.products[k].label)}${isCC && L.products[k].rate!==3 && L.products[k].type==='revolving' ? ' · '+pct(L.products[k].rate) : ''}</option>`;
      if (isCC){
        const groups={}; keys.forEach(k=>{ const g=L.products[k].group||'Other'; (groups[g]=groups[g]||[]).push(k); });
        $m('#dProd').innerHTML = keys.length ? Object.entries(groups).map(([g,ks])=>`<optgroup label="${esc(g)}">${ks.map(opt).join('')}</optgroup>`).join('') : `<option value="revolving">No match — use "Other card"</option>`;
      } else $m('#dProd').innerHTML = keys.map(opt).join('');
      $m('#dProdWrap').hidden = !isCC && keys.length<2;
      $m('#dProdWrap').style.gridColumn = isCC ? '1 / -1' : '';
      $m('#dProdLabel').textContent = isCC ? 'Card' : 'Product';
      $m('#dCardFind').hidden = !isCC;
    }
    function planUI(){
      $m('#dPlanWrap').hidden = !isCardPlan();
      m.querySelectorAll('#dPlan [data-plan]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.plan===plan));
      $m('#dPlanHint').textContent = plan==='installment' ? 'A fixed monthly amount for a set number of months, like a balance conversion over 60 months.'
        : plan==='both' ? 'Track the installment and any new balance on the same card. They show as two linked debts with one combined monthly total.'
        : 'Purchases or a balance you carry from month to month, charged interest on what stays unpaid.';
    }
    const instBlock = (withRate) => { const v=k=>esc(st[k]??''); return `
      ${withRate?`<div class="eyebrow" style="margin-top:14px">Installment / balance conversion</div>`:''}
      <div class="grid-form">
        <label class="field">${withRate||isCardPlan()?'Amount converted':'Loan amount (principal)'}<div class="input-wrap"><span class="prefix">₱</span><input class="input num" id="fP" inputmode="decimal" required value="${v('principal')}"></div></label>
        <label class="field">Term<div class="input-wrap"><input class="input num" id="fN" style="padding-left:12px" inputmode="numeric" required value="${v('term')||prodOf().term||12}"><span class="suffix">months</span></div></label>
        ${withRate?`<label class="field">Add-on rate<div class="input-wrap"><input class="input num" id="fIR" style="padding-left:12px" inputmode="decimal" value="${st.instRate??1}"><span class="suffix">% / mo</span></div></label>`:''}
        <label class="field">Months already paid<input class="input num" id="fPaid" inputmode="numeric" value="${v('paidMonths')||0}"></label>
        <label class="field" style="grid-column:1/-1">Actual monthly amortization <span class="hint">optional — the exact figure on your statement</span><div class="input-wrap"><span class="prefix">₱</span><input class="input num" id="fAm" inputmode="decimal" value="${st.amort||''}" placeholder="Computed automatically"></div></label>
      </div>`; };
    const revBlock = (both) => { const v=k=>esc(st[k]??''); return `
      ${both?`<div class="eyebrow" style="margin-top:2px">Unpaid balance besides the installment</div>`:''}
      <div class="grid-form">
        <label class="field">${both?'Balance besides the installment':'Current balance'}<div class="input-wrap"><span class="prefix">₱</span><input class="input num" id="fB" inputmode="decimal" required value="${v('balance')}"></div></label>
        <label class="field">You plan to pay on it monthly<div class="input-wrap"><span class="prefix">₱</span><input class="input num" id="fPay" inputmode="decimal" value="${v('payment')}" placeholder="Suggested below"></div></label>
        <label class="field">Credit limit <span class="hint">optional</span><div class="input-wrap"><span class="prefix">₱</span><input class="input num" id="fL" inputmode="decimal" value="${v('limit')}"></div></label>
      </div>`; };
    function fields(){
      planUI();
      const p=prodOf(), md=mode();
      $m('#dRateLabel').textContent = md==='installment' ? 'Monthly add-on rate' : md==='both' ? 'Interest on the unpaid balance' : (($m('#dLender').value==='mayaec')?'Monthly service fee':'Monthly interest rate');
      $m('#dNote').innerHTML = esc(p.note) + (p.terms?` <span class="faint">Terms: ${esc(p.terms)}.</span>`:'') + ` <span class="faint">Range ${pct(p.min)}–${pct(p.max)}. Change it if your statement shows a different rate.</span>`;
      const due = `<div class="grid-form" style="margin-top:12px"><label class="field">Due day${md==='both'?' (same statement)':''}<input class="input num" id="fDue" type="number" min="1" max="31" placeholder="1–31" value="${esc(st.dueDay??'')}"></label></div>`;
      const isPerson = $m('#dLender').value==='person';
      $m('#dNickLbl').innerHTML = isPerson ? 'Who do you owe?' : 'Nickname <span class="hint">optional, e.g. "BPI Amore card"</span>';
      $m('#dNick').placeholder = isPerson ? 'e.g. Tita Lorna' : '';
      m.querySelector('.rate-box').hidden = md==='schedule';
      if (md==='schedule'){
        $m('#dFields').innerHTML = `<p class="hint" style="margin:0 0 10px">${esc(p.note)}</p><div class="eyebrow" style="margin-bottom:8px">${isPerson?'When will you pay, and how much?':'Amount due each month'}</div><div id="schedBox"></div>` + due.replace('Due day','Due day <span class="hint">optional, same day each month</span>');
        schedCtl = mountSched($m('#schedBox'), st.schedule, ()=>calc(), {start: isPerson?shiftMonth(monthKey(),1):monthKey()});
      } else { schedCtl = null;
      $m('#dFields').innerHTML = (md==='both' ? revBlock(true) + instBlock(true) : md==='installment' ? instBlock(false) : revBlock(false)) + due; }
      m.querySelectorAll('#dFields input').forEach(i=>i.addEventListener('input',()=>{ readBack(); calc(); }));
      calc();
    }
    function readBack(){ const has=s=>!!$m(s), g=s=>$m(s).value;
      if(has('#fP')) st.principal=g('#fP'); if(has('#fN')) st.term=g('#fN'); if(has('#fPaid')) st.paidMonths=g('#fPaid'); if(has('#fAm')) st.amort=g('#fAm'); if(has('#fIR')) st.instRate=g('#fIR');
      if(schedCtl && has('#schedBox')) st.schedule=schedCtl.get();
      if(has('#fB')) st.balance=g('#fB'); if(has('#fPay')) st.payment=g('#fPay'); if(has('#fL')) st.limit=g('#fL'); if(has('#fDue')) st.dueDay=g('#fDue'); }
    function instCalc(r){ const P=num($m('#fP').value), n=Math.round(num($m('#fN').value)), paid=Math.round(num($m('#fPaid').value)), am=num($m('#fAm').value);
      const pmt=am>0?am:addonPmt(P,r,n); return {P,n,paid,pmt,e:eirFromAddon(r,n),ok:P>0&&n>0}; }
    function revCalc(r){ const B=num($m('#fB').value), pay=num($m('#fPay').value), i=B*r/100, sugg=Math.ceil(Math.max(500,B*0.05+i)/50)*50;
      let months='—'; if(B>0){ const sm=simulate([{id:'x',bal:B,rate:r/100,min:pay>0?pay:sugg}],0,'avalanche',false); months=sm.stuck?'Never':sm.months+' months'; }
      return {B,pay,i,sugg,months,ok:B>0}; }
    function calc(){
      const md=mode(), r=num($m('#dRate').value), none=t=>`<div><span>Preview</span><strong class="faint" style="font-weight:500">${t}</strong></div>`;
      if (md==='schedule'){ const sc=schedCtl?schedCtl.get():[]; const sf=schedFacts(sc);
        $m('#dCalc').innerHTML = sc.length ? `<div><span>Total</span><strong>${peso(sf.total,sf.total%1?2:0)}</strong></div><div><span>Still to pay</span><strong>${peso(sf.remaining,sf.remaining%1?2:0)}</strong></div><div><span>Due this month</span><strong>${peso(sf.dueNow)}</strong></div><div><span>Months</span><strong>${monthShort(sc[0].month)}${sc.length>1?' – '+monthShort(sc[sc.length-1].month):''}</strong></div>` : none('Add at least one month and amount');
        return; }
      if (md==='installment'){ const c=instCalc(r);
        $m('#dCalc').innerHTML = c.ok ? `<div><span>Monthly</span><strong>${peso(c.pmt,2)}</strong></div><div><span>Effective rate</span><strong>${pct(c.e*100)}/mo · ${pct(c.e*1200,1)}/yr</strong></div><div><span>Total interest</span><strong>${peso(c.pmt*c.n-c.P)}</strong></div><div><span>Left to pay</span><strong>${peso(c.pmt*Math.max(0,c.n-c.paid))}</strong></div><div><span>Ends</span><strong>${futureLabel(Math.max(0,c.n-c.paid))}</strong></div>` : none('Enter amount and term');
      } else if (md==='balance'){ const c=revCalc(r);
        $m('#dCalc').innerHTML = c.ok ? `<div><span>Interest this month</span><strong>${peso(c.i,2)}</strong></div><div><span>Suggested payment</span><strong>${peso(c.sugg)}</strong></div><div><span>Payoff time</span><strong>${c.months}</strong></div><div><span>Yearly rate</span><strong>${pct(r*12,1)}</strong></div>` : none('Enter your balance');
      } else { const ci=instCalc(num($m('#fIR').value)), cr=revCalc(r); const revPay = cr.ok ? (cr.pay>0?cr.pay:cr.sugg) : 0;
        $m('#dCalc').innerHTML = (ci.ok||cr.ok) ? `<div><span>Installment / mo</span><strong>${ci.ok?peso(ci.pmt,2):'—'}</strong></div><div><span>Balance payment</span><strong>${cr.ok?peso(revPay):'—'}</strong></div><div><span>Card total / mo</span><strong>${peso((ci.ok?ci.pmt:0)+revPay,2)}</strong></div><div><span>Balance interest</span><strong>${cr.ok?peso(cr.i,2)+'/mo':'—'}</strong></div><div><span>Balance payoff</span><strong>${cr.months}</strong></div><div><span>Installment ends</span><strong>${ci.ok?futureLabel(Math.max(0,ci.n-ci.paid)):'—'}</strong></div>` : none('Enter the installment and the balance');
      }
    }
    function autofill(){ const p=prodOf(); if(!rateTouched){ $m('#dRate').value=p.rate; $m('#dAuto').hidden=false; } if(p.type==='addon' && !d){ st.term = p.term; } }
    fillProducts(st.product);
    if (d){ $m('#dAuto').hidden = num(d.rate)!==prodOf().rate; }
    fields();
    $m('#dLender').onchange=()=>{ readBack(); rateTouched=false; $m('#dCardQ').value=''; fillProducts(); autofill(); fields(); if($m('#dLender').value==='cc') $m('#dCardQ').focus(); };
    $m('#dCardQ').oninput=()=>{ const before=$m('#dProd').value; readBack(); fillProducts(before); if ($m('#dProd').value!==before){ rateTouched=false; autofill(); fields(); } };
    $m('#dProd').onchange=()=>{ readBack(); rateTouched=false; autofill(); fields(); };
    m.querySelectorAll('#dPlan [data-plan]').forEach(b=>b.onclick=()=>{ if(plan===b.dataset.plan) return; readBack(); plan=b.dataset.plan; rateTouched=false; autofill(); fields(); });
    $m('#dRate').oninput=()=>{ rateTouched=true; $m('#dAuto').hidden = num($m('#dRate').value)===prodOf().rate; calc(); };
    $m('#dForm').onsubmit=e=>{ e.preventDefault(); readBack();
      const md=mode(), lender=$m('#dLender').value, product=$m('#dProd').value, nickname=$m('#dNick').value.trim(), dueDay=+st.dueDay||0;
      const mkInst = (rate, extra) => { const r={ lender, product, nickname, type:'addon', rate, dueDay, principal:num(st.principal), term:Math.max(1,Math.round(num(st.term))), paidMonths:Math.max(0,Math.round(num(st.paidMonths))), amort:num(st.amort)||0, ...extra }; if (r.paidMonths>r.term) r.paidMonths=r.term; return r; };
      const mkRev = (rate, extra, prev) => { const bal=num(st.balance); return { lender, product, nickname, type:'revolving', rate, dueDay, balance:bal, payment:num(st.payment)||0, limit:num(st.limit)||0, paidTotal:prev?.paidTotal||0, startBalance: prev && prev.type==='revolving' ? Math.max(prev.startBalance||0, bal) : bal, ...extra }; };
      if (md==='schedule'){ if (!(st.schedule||[]).length) return toast('Add at least one month with an amount.'); if (lender==='person' && !nickname) return toast('Enter who you owe.'); }
      if ((md==='installment'||md==='both') && num(st.principal)<=0) return toast(isCardPlan()?'Enter the amount converted to installment.':'Enter the loan amount.');
      if ((md==='balance'||md==='both') && st.balance==='' ) return toast('Enter the balance (0 if none).');
      if (commitCheck()) return;
      const card = isCardPlan();
      let recs;
      if (md==='both'){ const link=uid(), when=today();
        recs=[ {id:uid(), createdAt:when, ...mkInst(num(st.instRate), {plan:'installment', linkId:link})}, {id:uid(), createdAt:when, ...mkRev(num($m('#dRate').value), {plan:'balance', linkId:link})} ];
      } else { const extra = { id:d?d.id:uid(), createdAt:d?.createdAt||today(), ...(card?{plan:md}:{}), ...(d?.linkId?{linkId:d.linkId}:{}) };
        recs=[ md==='schedule' ? { lender, product, nickname, type:'schedule', rate:0, dueDay, schedule:st.schedule, ...extra } : md==='installment' ? mkInst(num($m('#dRate').value), extra) : mkRev(num($m('#dRate').value), extra, d) ];
        recs[0].id=extra.id; recs[0].createdAt=extra.createdAt; }
      const wasDone = d && debtFacts(d).done;
      if (d && d.type==='revolving') markBilled(d.id);
      if (d) S.debts.splice(S.debts.findIndex(x=>x.id===d.id),1,recs[0]); else S.debts.push(...recs);
      if (d && d.linkId){ S.debts.forEach(x=>{ if(x.linkId===d.linkId && x.id!==d.id){ x.dueDay=recs[0].dueDay; x.nickname=recs[0].nickname; x.product=recs[0].product; x.lender=recs[0].lender; } }); }
      closeModal(); commit('debts'); toast(d?'Debt updated':md==='both'?'Card added: installment and balance tracked together':'Debt added');
      if (!wasDone && debtFacts(recs[0]).done){ confetti(); toast(`${debtName(recs[0])} is paid off!`); }
    };
  });
}

function payDebtModal(id, prefill){
  const d=S.debts.find(x=>x.id===id); const f=debtFacts(d); const def = prefill>0 ? Math.min(prefill, f.remaining) : d.type==='schedule' ? (f.pmt || f.next?.left || 0) : (d.type==='addon'?f.pmt:(d.payment||f.setPmt));
  openModal(`${mhead('Log a payment')}<form id="pForm" style="display:flex;flex-direction:column;gap:14px">
    <div class="row" style="padding:0"><div class="lender-badge" style="background:${lenderLook(d).color}">${lenderLook(d).short}</div><div class="grow"><div class="title">${esc(debtName(d))}</div><div class="meta">${d.type==='schedule'?`${peso(f.remaining)} left · ${f.remN} payment${f.remN===1?'':'s'}`:d.type==='addon'?`${f.remN} of ${d.term} payments left`:`Balance ${peso(d.balance)}`}</div></div></div>
    <div class="grid-form"><label class="field">Amount paid<div class="input-wrap"><span class="prefix">₱</span><input class="input num" id="pAmt" inputmode="decimal" value="${def.toFixed(2)}"></div></label>
    <label class="field">Date<input class="input" type="date" id="pDate" value="${today()}"></label></div>
    ${d.type==='schedule'?`<span class="hint">Goes to the oldest unpaid month first${f.next?' ('+monthLabel(f.next.month,true)+')':''}. Paying less leaves the rest of that month open.</span>`:d.type==='addon'?`<span class="hint" id="pHint">Counts as one monthly amortization. A bigger amount counts as several months (each ${peso(f.pmt,2)}).</span>`:`<span class="hint">Kaban subtracts this from the balance. Update the balance from your next statement to include new interest or purchases.</span>`}
    ${accts().length?`<label class="field">Paid from<select class="input" id="pAcct">${acctOptions(defaultAcct())}</select></label>`:''}
    <label class="row" style="padding:0;cursor:pointer"><input type="checkbox" id="pExp" checked style="width:18px;height:18px;accent-color:var(--pine)"><span class="small">Also record it in this month's expenses as a debt payment</span></label>
    ${chargeCredit(d)>0?`<span class="hint">${peso(chargeCredit(d))} of this card's balance is purchases you already logged as expenses. That part of your payment won't be counted as spending again.</span>`:''}
    <div class="modal-foot"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">${ico('check')}Log payment</button></div></form>`, m=>{
    m.querySelector('#pForm').onsubmit=e=>{ e.preventDefault(); if (commitCheck()) return; const amt=num($('#pAmt').value); if(amt<=0) return toast('Enter the amount you paid.');
      if (d.type==='schedule'){ const over=applyToSched(d.schedule, amt); if (over>0.5) toast(`That's ${peso(over)} more than you owe — the extra wasn't applied.`); }
      else if (d.type==='addon') d.paidMonths=Math.min(d.term,(d.paidMonths||0)+Math.max(1,Math.floor((amt+0.01)/f.pmt))); else { const eff=debtFacts(d).remaining; d.balance=Math.max(0, eff-amt); markBilled(d.id); d.paidTotal=(d.paidTotal||0)+amt; }
      const credit=chargeCredit(d), covered=Math.min(amt, credit); if (covered>0) d.chargeRepaid=num(d.chargeRepaid)+covered;
      const names=['debts']; const pa=$('#pAcct')?$('#pAcct').value:''; { const pk=($('#pDate').value||today()).slice(0,7); d.monthPaid={...(d.monthPaid||{}), [pk]: num((d.monthPaid||{})[pk]) + amt}; }
      { const pk2=($('#pDate').value||today()).slice(0,7); if (covered>0) d.monthCovered={...(d.monthCovered||{}), [pk2]: num((d.monthCovered||{})[pk2])+covered}; if (covered>0 && pa) S.transfers=(S.transfers||[]).concat([{id:uid(),date:$('#pDate').value||today(),from:pa,to:'',amount:covered,note:'Card payment · '+debtName(d)}]); }
      const amtX = amt - covered;
      if (amtX<=0.005){ /* fully covered by purchases already counted as spending */ }
      else if ($('#pExp').checked){ const amt=amtX; const date=$('#pDate').value||today(), k=date.slice(0,7); (S.expenses[k]=S.expenses[k]||[]).push({id:uid(),amount:amt,date,cat:'debtpay',note:debtName(d),debtId:d.id,...(pa?{acct:pa}:{})}); names.push('exp-'+k); }
      else if (pa){ S.transfers=(S.transfers||[]).concat([{id:uid(),date:$('#pDate').value||today(),from:pa,to:'',amount:amtX,note:'Payment · '+debtName(d)}]); }
      if (covered>0) setTimeout(()=>toast(`${peso(covered)} of this pays for purchases you already logged, so it isn't counted as spending twice.`), 1800);
      closeModal(); commit(...names);
      if (debtFacts(d).done){ confetti(); toast(`${debtName(d)} is paid off! That's one less to carry.`); } else toast(`Payment logged. ${peso(debtFacts(d).remaining)} to go.`);
    };
  });
}

/* ---------- actions ---------- */
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act, id=b.dataset.id;
  if (a && b.tagName==='A') e.preventDefault();
  switch(a){
    case 'close': closeModal(); break;
    case 'settings': backupModal(); break;
    case 'install-app': if (INSTALL_EVT){ INSTALL_EVT.prompt(); INSTALL_EVT.userChoice.finally(()=>{ INSTALL_EVT=null; closeModal(); }); } break;
    case 'sync-connect': connectSync(b.closest('.modal')); break;
    case 'sync-now': closeModal(); pullFromDrive(false).then(()=>{ if (MODE==='cloud') pushNow(); toast('Synced'); }); break;
    case 'sync-off': if (b.dataset.confirm!=='1'){ b.dataset.confirm='1'; b.textContent='Tap again to disconnect'; return; } setSyncCfg(null); MODE = MODE==='demo'?'demo':'local'; closeModal(); setSync(); render(); toast('This device is disconnected. Your Drive data is untouched.'); break;
    case 'sync-use-drive': { const r=window.__kabanRemote; if (r){ adopt(r); MODE='cloud'; saveLocal(); markPending(false); } closeModal(); setSync(); render(); toast('Loaded your data from Google Drive'); break; }
    case 'sync-use-device': { MODE='cloud'; S.updatedAt=Date.now(); saveLocal(); closeModal(); pushNow(); setSync(); render(); toast('This device\'s data is now saved to your Drive'); break; }
    case 'bk-copy': { const t=JSON.stringify(S); const ta=$('#bkText'); ta.value=t; ta.select(); try{ navigator.clipboard.writeText(t).then(()=>toast('Backup copied. Paste it into a note or email to yourself.'),()=>toast('Backup is selected in the box — copy it from there.')); }catch(_){ toast('Backup is selected in the box — copy it from there.'); } break; }
    case 'bk-restore': { const t=$('#bkText').value.trim(); let d=null; try{ d=JSON.parse(t); }catch(_){} if(!d||!d.profile){ toast('That doesn\'t look like a Kaban backup. Paste the full text you copied.'); break; }
      if (b.dataset.confirm!=='1'){ b.dataset.confirm='1'; b.textContent='Tap again to replace everything'; break; }
      adopt(d); S.updatedAt=Date.now(); MODE = canSync()?'cloud':'local'; closeModal(); saveLocal(); flush(); setSync(); render(); toast('Backup restored'); break; }
    case 'start-fresh': leaveDemo(false); toast('Fresh start. Add your income, bills and debts.'); break;
    case 'add-expense': expenseModal(); break;
    case 'edit-expense': expenseModal(id); break;
    case 'del-expense': { if (commitCheck()) return; { const ex0=allExpenses().find(x=>x.id===id); if (ex0) detachCharge(ex0,true); } for(const k in S.expenses){ const n=S.expenses[k].length; S.expenses[k]=S.expenses[k].filter(x=>x.id!==id); if(S.expenses[k].length!==n){ closeModal(); commit('exp-'+k); toast('Expense deleted'); break; } } break; }
    case 'exp-month': EXP_MONTH=shiftMonth(EXP_MONTH,+b.dataset.k); render(); break;
    case 'add-debt': debtModal(); break;
    case 'edit-debt': debtModal(id); break;
    case 'pay-debt': $('.toast')&&($('.toast').hidden=true); payDebtModal(id, num(b.dataset.amt||0)); break;
    case 'add-extra': extraModal(); break;
    case 'add-acct': acctModal(); break;
    case 'add-rec': recModal(); break;
    case 'edit-rec': recModal(id); break;
    case 'collect': collectModal(id); break;
    case 'del-rec': { if (b.dataset.confirm!=='1'){ b.dataset.confirm='1'; b.innerHTML=ico('trash')+'Tap again to delete'; return; } if (commitCheck()) return; S.receivables=recList().filter(r=>r.id!==id); closeModal(); commit(); toast('Pautang removed'); break; }
    case 'edit-acct': acctModal(id); break;
    case 'transfer': transferModal(id); break;
    case 'withdraw': transferModal(id, null, 0, 'withdraw'); break;
    case 'fund-allow': { const cl=monthChecklist(); const need=cl.items.filter(x=>x.kind==='bill'&&x.from===id&&!x.done).reduce((s,x)=>s+x.expected,0); const gap=need-acctBalance(acctById(id)); const src=accts().find(a=>a.id!==id && acctType(a).spend)?.id; transferModal(src, id, Math.max(0,gap)); break; }
    case 'adjust-acct': adjustModal(id); break;
    case 'del-acct': { if (b.dataset.confirm!=='1'){ b.dataset.confirm='1'; b.innerHTML=ico('trash')+'Tap again — its history stops counting'; return; } if (commitCheck()) return;
      S.profile.accounts=accts().filter(a=>a.id!==id); if(S.profile.defaultAcct===id) S.profile.defaultAcct='';
      allExpenses().forEach(e=>{ if(e.acct===id) delete e.acct; }); allInflows().forEach(x=>{ if(x.acct===id) delete x.acct; }); S.transfers=(S.transfers||[]).filter(t=>t.from!==id && t.to!==id);
      closeModal(); commit(); toast('Account deleted'); break; }
    case 'edit-extra': extraModal(id); break;
    case 'del-extra': { if (commitCheck()) return; for (const k in (S.extras||{})){ const n=S.extras[k].length; S.extras[k]=S.extras[k].filter(x=>x.id!==id); if(S.extras[k].length!==n) break; } closeModal(); commit(); toast('Removed'); break; }
    case 'del-debt': if (b.dataset.confirm!=='1'){ b.dataset.confirm='1'; b.innerHTML=ico('trash')+'Tap again to delete'; return; } if (commitCheck()) return; S.debts=S.debts.filter(x=>x.id!==id); CONS.picked=null; closeModal(); commit('debts'); toast('Debt removed'); break;
    case 'debt-filter': DEBT_FILTER=b.dataset.k; render(); break;
    case 'add-income': simpleModal('income'); break;
    case 'edit-income': simpleModal('income',id); break;
    case 'add-bill': simpleModal('bill'); break;
    case 'edit-bill': simpleModal('bill',id); break;
    case 'del-simple': { if (commitCheck()) return; const k=b.dataset.kind==='income'?'income':'bills'; S.profile[k]=S.profile[k].filter(x=>x.id!==id); closeModal(); commit('profile'); break; }
    case 'pay-bill': payBillModal(id, +(b.dataset.part||0)); break;
    case 'edit-move': editMoveModal(id); break;
    case 'del-move': { if (commitCheck()) return; S.transfers=(S.transfers||[]).filter(t=>t.id!==id); for (const k in S.expenses) S.expenses[k]=S.expenses[k].filter(e=>e.feeOf!==id); closeModal(); commit(); toast('Transfer undone'); break; }
    case 'add-check': checkItemModal(); break;
    case 'edit-oneoff': checkItemModal(id); break;
    case 'pay-oneoff': payOneoffModal(id); break;
    case 'del-oneoff': { if (commitCheck()) return; const mk=monthKey(); S.oneoffs[mk]=(S.oneoffs[mk]||[]).filter(x=>x.id!==id); closeModal(); commit(); toast('Removed from this month'); break; }
    case 'log-pay': logPayModal(id, b.dataset.part!=null ? +b.dataset.part : undefined); break;
    case 'edit-budgets': budgetsModal(); break;
    case 'add-cat': catModal(); break;
    case 'edit-cat': catModal(id); break;
    case 'del-cat': { if (b.dataset.confirm!=='1'){ b.dataset.confirm='1'; b.innerHTML=ico('trash')+'Tap again — past entries move to Other'; return; } if (commitCheck()) return;
      S.profile.customCats=customCats().filter(c=>c.id!==id); const nb={...(S.profile.budgets||{})}; delete nb[id]; S.profile.budgets=nb;
      Object.values(S.expenses).forEach(list=>list.forEach(e=>{ if(e.cat===id) e.cat='other'; })); if(EXP_CAT===id) EXP_CAT='food';
      closeModal(); S.updatedAt=Date.now(); commit(); toast('Category deleted'); break; }
    case 'suggest-budget': { if (commitCheck()) return; const inc=incomeTotal(); if(!inc) return toast('Add your income first.'); const avail=Math.max(0, inc - billsTotal() - debtTotals().monthly);
      const w={food:.34,transport:.12,family:.14,health:.05,school:.04,shopping:.05,fun:.06,savings:.15,other:.05}; const nb={}; Object.entries(w).forEach(([c,x])=>nb[c]=Math.round(avail*x/50)*50);
      customCats().forEach(c=>{ const v=(S.profile.budgets||{})[c.id]; if(v) nb[c.id]=v; }); S.profile.budgets=nb; commit('profile'); toast('Budgets suggested from what\'s left after bills and debt. Adjust any of them.'); break; }
    case 'set-strategy': if (MODE==='demo'){ S.profile.strategy=b.dataset.k; render(); break; } S.profile.strategy=b.dataset.k; commit('profile'); break;
  }
});
document.addEventListener('submit', e=>{
  if (e.target.id!=='quickForm') return; e.preventDefault();
  const amt=num($('#qAmount').value); if (amt<=0){ toast('Enter an amount above zero.'); return; }
  if (MODE==='demo'){ leaveDemo(true); return; }
  const date=$('#qDate').value||today(), k=date.slice(0,7);
  const tv=$('#qAcct')?$('#qAcct').value:'', tgt=parseTarget(tv), acct=tgt.acct||''; const qrec={id:uid(),amount:amt,date,cat:EXP_CAT,note:$('#qNote').value.trim(),...tgt}; (S.expenses[k]=S.expenses[k]||[]).push(qrec); if(tgt.charge) attachCharge(qrec, QCO&&QCO.get()); if(acct) S.profile.defaultAcct=acct;
  commit('exp-'+k); { const bc=budgetCheck(), b=num((S.profile.budgets||{})[EXP_CAT]), sp=spentBy(monthKey())[EXP_CAT]||0;
    toast(`${peso(amt,amt%1?2:0)} added to ${catById(EXP_CAT).name}${acct?' · from '+acctName(acct):tgt.charge?' · '+targetName(qrec):''}` + (bc.safe<0 ? ` — heads up: you're ${peso(-bc.safe)} over for this month.` : b && sp>b ? ` — ${catById(EXP_CAT).name} is now ${peso(sp-b)} over budget.` : '')); }
  setTimeout(()=>$('#qAmount')&&$('#qAmount').focus(),0);
});
document.addEventListener('click', e=>{ const c=e.target.closest('#qCats [data-cat]'); if(!c) return; EXP_CAT=c.dataset.cat; document.querySelectorAll('#qCats [data-cat]').forEach(x=>x.setAttribute('aria-pressed', x===c)); });
let extraT;
document.addEventListener('input', e=>{
  if (e.target.id==='extraRange'){ S.profile.extra=+e.target.value; clearTimeout(extraT); const y=scrollY; extraT=setTimeout(()=>{ if(MODE==='demo'){ render(); } else commit('profile'); scrollTo({top:y}); const r=$('#extraRange'); r&&r.focus(); },220); const chip=e.target.closest('.panel').querySelector('.chip'); if(chip) chip.textContent=peso(+e.target.value)+' / month'; }
  if (['consRate','consTerm','consFee'].includes(e.target.id)){ clearTimeout(extraT); const id=e.target.id, pos=e.target.selectionStart; extraT=setTimeout(()=>{ CONS.rate=num($('#consRate').value); CONS.term=Math.max(1,Math.round(num($('#consTerm').value))||1); CONS.fee=num($('#consFee').value); const y=scrollY; render(); scrollTo({top:y}); const el=$('#'+id); if(el){ el.focus(); try{el.setSelectionRange(pos,pos)}catch(_){} } },450); }
});
document.addEventListener('change', e=>{
  if (e.target.matches('[data-cons]')){ const id=e.target.dataset.cons; CONS.picked = e.target.checked ? [...new Set([...(CONS.picked||[]),id])] : (CONS.picked||[]).filter(x=>x!==id); const y=scrollY; render(); scrollTo({top:y}); }
  if (e.target.id==='consLender'){ const [k,pk]=e.target.value.split(':'); const p=LENDERS[k].products[pk]; CONS.lender=e.target.value; CONS.rate=p.rate; CONS.term=p.term||24; CONS.fee = k==='gcash'?3:0; const y=scrollY; render(); scrollTo({top:y}); }
});

/* ---------- offline app shell (installed app only) ---------- */
if (!GAS && 'serviceWorker' in navigator && window.isSecureContext && /^https?:/.test(location.protocol)){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').then(reg=>{
      reg.addEventListener('updatefound', ()=>{ const w=reg.installing; if(!w) return; w.addEventListener('statechange', ()=>{
        if (w.state==='installed' && navigator.serviceWorker.controller){ const t=document.createElement('div'); t.className='toast'; t.innerHTML='A new version of Kaban is ready. <button class="btn sm gold" style="margin-left:8px" id="swReload">Update</button>'; document.body.appendChild(t); t.querySelector('#swReload').onclick=()=>{ w.postMessage('skip'); }; }
      }); });
    }).catch(()=>{});
    let reloading=false; navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(!reloading){ reloading=true; location.reload(); } });
  });
}
boot();
