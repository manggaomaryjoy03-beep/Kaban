<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D6F60" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1714" media="(prefers-color-scheme: dark)">
<meta name="description" content="Track expenses, budgets, debts and payoff plans — synced to your own Google Drive.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kaban">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>html{padding-top:env(safe-area-inset-top,0px)}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}@media (max-width:900px){.input,input,select,textarea{font-size:16px!important}}</style>
<title>Kaban Money Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — left rail on desktop, bottom tab bar on phones; content is a grid of panels. Palette: pine ink on cool mint, mango-gold accent. */
:root{
  --bg:#EEF3F0; --surface:#FFFFFF; --surface-2:#F5F8F6; --line:#D9E3DE; --ink:#11302A; --ink-2:#4A635C; --ink-3:#7D918B;
  --accent:#E39B2D; --accent-ink:#3A2405; --accent-soft:#FBEBD0; --pine:#1D6F60; --pine-soft:#DCEEE8;
  --good:#1F8A5B; --good-soft:#DDF2E7; --warn:#B7791F; --warn-soft:#FBEFD6; --bad:#C9433C; --bad-soft:#F9E1DF;
  --c1:#1D6F60; --c2:#E39B2D; --c3:#5B6CC9; --c4:#C9433C; --c5:#2E9CB0; --c6:#9A5BC2; --c7:#7BA33A; --c8:#D46A9E; --c9:#8A6E4B; --c10:#5F7F7A; --c11:#3D8BDB; --c12:#B0A23B;
  --shadow:0 1px 2px rgba(17,48,42,.06),0 6px 20px rgba(17,48,42,.06); --hero:#1D6F60;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1714; --surface:#13221E; --surface-2:#182A25; --line:#24392F; --ink:#E4EEEA; --ink-2:#A7BCB4; --ink-3:#71877F;
  --accent:#F0B24F; --accent-ink:#2A1A03; --accent-soft:#3A2C14; --pine:#4CC2A8; --pine-soft:#173A32;
  --good:#4CC28A; --good-soft:#163527; --warn:#E5B04E; --warn-soft:#3A2E14; --bad:#F07A71; --bad-soft:#3D1D1B;
  --c1:#4CC2A8; --c2:#F0B24F; --c3:#8D9BF0; --c4:#F07A71; --c5:#5FC6D8; --c6:#C08BE6; --c7:#A2CC5E; --c8:#EE92C0; --c9:#C4A57E; --c10:#8FB3AD; --c11:#73B2F0; --c12:#D9CB63;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --hero:#14463C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1714; --surface:#13221E; --surface-2:#182A25; --line:#24392F; --ink:#E4EEEA; --ink-2:#A7BCB4; --ink-3:#71877F;
  --accent:#F0B24F; --accent-ink:#2A1A03; --accent-soft:#3A2C14; --pine:#4CC2A8; --pine-soft:#173A32;
  --good:#4CC28A; --good-soft:#163527; --warn:#E5B04E; --warn-soft:#3A2E14; --bad:#F07A71; --bad-soft:#3D1D1B;
  --c1:#4CC2A8; --c2:#F0B24F; --c3:#8D9BF0; --c4:#F07A71; --c5:#5FC6D8; --c6:#C08BE6; --c7:#A2CC5E; --c8:#EE92C0; --c9:#C4A57E; --c10:#8FB3AD; --c11:#73B2F0; --c12:#D9CB63;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --hero:#14463C; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,3.2vw,2.2rem);font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:.85rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;padding:24px 16px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--pine);display:grid;place-items:center;color:var(--bg)}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--ink-2);font-weight:600;text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--pine-soft);color:var(--pine)}
.nav svg{width:20px;height:20px;flex:none}
.check-btn{border:2px dashed color-mix(in srgb,currentColor 45%,transparent);cursor:pointer;padding:0;font:inherit;font-weight:700;font-size:.8rem}
.check-btn:hover{border-style:solid}
.check-btn.is-done{border:2px solid var(--good);background:var(--good)!important;color:var(--bg)!important}
.check-btn:disabled{cursor:default}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 8px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--ink-3)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.sync.cloud i{background:var(--good)} .sync.local i{background:var(--warn)}
main{padding-inline:clamp(16px,3vw,40px);padding-block:28px 48px;min-width:0;max-width:1240px;width:100%}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.topbar .sub{margin-top:4px}

/* buttons, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--pine);border-color:var(--pine);color:var(--bg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:8px}
.btn svg{width:17px;height:17px}
.icon-btn{border:0;background:none;padding:6px;border-radius:8px;cursor:pointer;color:var(--ink-3);display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
label.field{display:flex;flex-direction:column;gap:5px;font-size:.82rem;font-weight:600;color:var(--ink-2);min-width:0}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:.95rem;font-weight:500;color:var(--ink)}
.input:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px var(--pine-soft)}
.input-wrap{position:relative}
.input-wrap .prefix{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-weight:600;pointer-events:none}
.input-wrap .input{padding-left:28px}
.input-wrap .suffix{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-weight:600;pointer-events:none;font-size:.85rem}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.hint{font-size:.78rem;font-weight:500;color:var(--ink-3)}

/* panels */
.panels{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}.span-3{grid-column:span 3}
@media (max-width:1080px){.span-8,.span-7,.span-5,.span-4{grid-column:span 12}.span-3{grid-column:span 6}.span-6{grid-column:span 12}}
@media (max-width:560px){.span-3{grid-column:span 12}}

/* hero */
.hero{grid-column:span 12;background:var(--hero);color:#F2FAF7;border-radius:18px;padding:24px clamp(18px,3vw,32px);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:28px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(240,178,79,.32),transparent 70%);pointer-events:none}
.hero .eyebrow{color:rgba(242,250,247,.7)}
.hero-ring{width:132px;height:132px;position:relative;flex:none}
.hero-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.hero-ring .pct{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1}
.hero-ring .pct small{display:block;font-family:var(--f-body);font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.75;margin-top:4px}
.hero-big{font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,4.2vw,2.8rem);line-height:1.05;letter-spacing:-.02em}
.hero-line{margin-top:8px;color:rgba(242,250,247,.82);max-width:52ch}
.hero-line b{color:#FFD58C}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hero-stats div{display:flex;flex-direction:column;gap:2px}
.hero-stats strong{font-family:var(--f-display);font-size:1.3rem}
@media (max-width:900px){.hero{grid-template-columns:auto minmax(0,1fr)}.hero-stats{grid-column:span 2}}
@media (max-width:520px){.hero{grid-template-columns:1fr}.hero-stats{grid-column:auto}.hero-ring{width:112px;height:112px}}

/* kpis */
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .val{font-family:var(--f-display);font-weight:700;font-size:1.55rem;letter-spacing:-.01em}
.kpi .foot{font-size:.82rem;color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.neutral{background:var(--surface-2);color:var(--ink-2)} .chip.gold{background:var(--accent-soft);color:var(--warn)}

/* lists */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:.8rem;color:var(--ink-3)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.cat-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:700;font-size:.8rem}
.amount{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:26px 10px;text-align:center;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:10px}

/* progress */
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--pine)}
.bar.over > i{background:var(--bad)} .bar.near > i{background:var(--warn)}

/* debt cards */
.debts{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.debt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.debt-top{display:flex;gap:12px;align-items:flex-start}
.lender-badge{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.95rem;flex:none;color:#fff}
.debt-name{font-weight:700;font-size:1.02rem}
.debt-sub{font-size:.8rem;color:var(--ink-3)}
.debt-figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.debt-figs div{display:flex;flex-direction:column;gap:1px;min-width:0}
.debt-figs span{font-size:.72rem;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.debt-figs strong{font-variant-numeric:tabular-nums;font-size:.98rem;overflow:hidden;text-overflow:ellipsis}
.debt-actions{display:flex;gap:8px;flex-wrap:wrap}
.debt.paid{opacity:.72}
.debt.paid .lender-badge{background:var(--good)!important}

/* segmented */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:.85rem;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* banners */
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 18px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink);margin-bottom:18px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.insight{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.insight:first-child{border-top:0;padding-top:0}
.insight .mark{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.insight .mark svg{width:16px;height:16px}
.insight p{margin:2px 0 0;color:var(--ink-2);font-size:.88rem}
.mark.good{background:var(--good-soft);color:var(--good)}.mark.warn{background:var(--warn-soft);color:var(--warn)}.mark.bad{background:var(--bad-soft);color:var(--bad)}.mark.tip{background:var(--pine-soft);color:var(--pine)}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.8rem;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.donut-wrap{display:grid;grid-template-columns:170px minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:480px){.donut-wrap{grid-template-columns:1fr;justify-items:center}}
.scroll-x{overflow-x:auto}
@media (max-width:560px){.rec-side{flex-direction:row!important;flex-basis:100%;justify-content:space-between;align-items:center!important;padding-left:48px}}
@media (max-width:560px){.bill-actions{order:5;flex-basis:100%;padding-left:46px}}

table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t td.r,table.t th.r{text-align:right}
table.t tr:last-child td{border-bottom:0}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* compare cards */
.compare{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.compare{grid-template-columns:1fr}}
.cmp{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:var(--surface);text-align:left}
.cmp[aria-pressed="true"]{border-color:var(--pine);box-shadow:0 0 0 3px var(--pine-soft)}
.cmp .big{font-family:var(--f-display);font-weight:700;font-size:1.25rem}

/* quick add */
.quick{display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr) minmax(130px,190px) minmax(130px,150px) auto;gap:10px;align-items:end}
@media (max-width:760px){.quick{grid-template-columns:1fr 1fr}.quick .q-acct{order:1}.quick .q-note{grid-column:span 2;order:2}.quick .q-date{order:3}.quick .btn{order:4}}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.cats button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,20,17,.5);display:grid;place-items:center;padding:16px;z-index:50;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:18px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:16px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.rate-box{border:1px dashed color-mix(in srgb,var(--pine) 50%,transparent);background:var(--pine-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.rate-box .src{font-size:.8rem;color:var(--ink-2)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;background:var(--surface-2);border-radius:12px;padding:12px 14px}
.calc div{display:flex;flex-direction:column}
.calc span{font-size:.72rem;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.calc strong{font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:901px){.toast{bottom:28px}}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}

/* phone */
.tabbar{display:none}
.mobile-brand{display:none;align-items:center;gap:8px;margin-bottom:10px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  main{padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(7,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:40}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.62rem;font-weight:600;color:var(--ink-3);padding:6px 0;cursor:pointer}
  .tabbar svg{width:21px;height:21px}
  .tabbar button[aria-current="page"]{color:var(--pine)}
  .mobile-brand{display:flex}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>

</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><div class="brand-mark" id="brandMark"></div><div class="brand-name">Kaban</div></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <span class="sync" id="sync"><i></i><span>Connecting…</span></span>

const monthKey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const monthLabel = (key, long) => { const [y,m]=key.split('-').map(Number); return long ? new Date(y,m-1,1).toLocaleString('en-PH',{month:'long',year:'numeric'}) : `${MONTHS[m-1]} ${String(y).slice(2)}`; };
const shiftMonth = (key, k) => { const [y,m]=key.split('-').map(Number); return monthKey(new Date(y, m-1+k, 1)); };
// Simulation month m pays the bill due m-1 months from now (month 1 = this month's payment).
const payoffLabel = m => futureLabel(Math.max(0, m-1));
const futureLabel = k => { const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+k); return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };

/* ---------- finance math ---------- */
const addonPmt = (P, rPct, n) => n>0 ? P/n + P*rPct/100 : 0;
function eirFromAddon(rPct, n){ // monthly effective rate (decimal) for an add-on loan
  if (!(n>0) || rPct<=0) return 0;
  const k = 1/n + rPct/100; let lo=0, hi=1;
  const f = i => (1-Math.pow(1+i,-n))/i - 1/k;
  for (let t=0;t<80;t++){ const mid=(lo+hi)/2; if (f(mid)>0) lo=mid; else hi=mid; }
  return (lo+hi)/2;
}

/* ---------- month-by-month schedules (pay-later debts, personal debts, pautang) ---------- */
const monthDiff = (a,b) => { const [ya,ma]=a.split('-').map(Number), [yb,mb]=b.split('-').map(Number); return (yb-ya)*12+(mb-ma); };
function schedFacts(sc){
  const mk=monthKey(); const rows=(sc||[]).map(e=>({...e, left:Math.max(0,num(e.amount)-num(e.paid))}));
  const unpaid=rows.filter(e=>e.left>0.5).sort((a,b)=>a.month.localeCompare(b.month));
  return { rows, unpaid, next:unpaid[0], overdue:unpaid.filter(e=>e.month<mk),
    dueNow: unpaid.filter(e=>e.month<=mk).reduce((s,e)=>s+e.left,0),
    remaining: unpaid.reduce((s,e)=>s+e.left,0),
    paid: rows.reduce((s,e)=>s+Math.min(num(e.amount),num(e.paid)),0),
    total: rows.reduce((s,e)=>s+num(e.amount),0) };
}
// Apply a payment to the oldest unpaid months first. Returns any amount left over.
function applyToSched(sc, amt){ let r=amt; (sc||[]).slice().sort((a,b)=>a.month.localeCompare(b.month)).forEach(e=>{ if(r<=0.005) return; const left=Math.max(0,num(e.amount)-num(e.paid)); const p=Math.min(left,r); e.paid=Math.round((num(e.paid)+p)*100)/100; r-=p; }); return Math.max(0,r); }
const monthShort = key => { const [y,m]=key.split('-').map(Number); return MONTHS[m-1] + (y!==new Date().getFullYear()?" '"+String(y).slice(2):''); };
function schedStrip(sc, max=8){
  const mk=monthKey(); const rows=(sc||[]).slice().sort((a,b)=>a.month.localeCompare(b.month));
  const firstOpen = Math.max(0, rows.findIndex(e=>num(e.amount)-num(e.paid)>0.5)); const start=Math.max(0, Math.min(firstOpen-1, rows.length-max));
  const view=rows.slice(start,start+max);
  return `<div style="display:flex;flex-wrap:wrap;gap:6px">${start?`<span class="chip neutral">+${start} done</span>`:''}${view.map(e=>{ const left=num(e.amount)-num(e.paid), done=left<=0.5;
    const cls = done?'good': e.month<mk?'bad': e.month===mk?'warn':'neutral';
    return `<span class="chip ${cls}" title="${monthLabel(e.month,true)}">${done?ico('check','style="width:11px;height:11px"'):''}${monthShort(e.month)} · ${peso(done?num(e.amount):left)}</span>`; }).join('')}${rows.length>start+max?`<span class="chip neutral">+${rows.length-start-max} more</span>`:''}</div>`;
}
function mountSched(box, rows, onChange, o={}){
  let list = (rows&&rows.length?rows:[{id:uid(),month:o.start||monthKey(),amount:o.amount||'',paid:0}]).map(r=>({...r}));

    box.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px">${list.map((r,i)=>`<div class="sRow" style="display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) 34px;gap:8px;align-items:center">

        <div class="input-wrap"><span class="prefix">₱</span><input class="input num" data-a inputmode="decimal" value="${esc(r.amount??'')}" aria-label="Amount" placeholder="0"></div>
        ${num(r.paid)>0?`<span class="chip good" title="${esc(o.paidWord||'Paid')} ${peso(num(r.paid))}" style="padding:4px 7px;justify-content:center">${ico('check','style="width:12px;height:12px"')}</span>`:`<button type="button" class="icon-btn" data-srm="${i}" aria-label="Remove this month">${ico('x')}</button>`}
      </div>`).join('')}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button type="button" class="btn sm" data-sadd>${ico('plus')}Add a month</button><button type="button" class="btn sm ghost" data-sfill>Same amount for several months</button></div>
      <div data-sfillbox hidden style="margin-top:8px;padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)"><div class="grid-form" style="align-items:end">
        <label class="field">Amount each month<div class="input-wrap"><span class="prefix">₱</span><input class="input num" data-fa inputmode="decimal"></div></label>
        <label class="field">How many months<input class="input num" data-fn inputmode="numeric" value="3"></label>
        <label class="field">Starting<input class="input" type="month" data-fs value="${nm()}"></label>
        <button type="button" class="btn sm primary" data-fgo>Add these months</button></div></div>`;
  }
  box.addEventListener('input', e=>{ if (e.target.matches('[data-m],[data-a]')){ readDom(); changed(); } });

    const rm=e.target.closest('[data-srm]');

    if (e.target.closest('[data-sadd]')){ readDom(); list.push({id:uid(),month:nm(),amount:'',paid:0}); draw(); changed(); const a=box.querySelectorAll('[data-a]'); a[a.length-1]?.focus(); return; }
    if (e.target.closest('[data-sfill]')){ const fb=box.querySelector('[data-sfillbox]'); fb.hidden=!fb.hidden; if(!fb.hidden) fb.querySelector('[data-fa]').focus(); return; }
    if (e.target.closest('[data-fgo]')){ readDom(); const a=num(box.querySelector('[data-fa]').value), n=Math.max(1,Math.min(60,Math.round(num(box.querySelector('[data-fn]').value)))), st=box.querySelector('[data-fs]').value||nm();
      if (a<=0) return toast('Enter the amount for each month.');
      list = list.filter(r=>num(r.amount)>0||num(r.paid)>0);
      for (let i=0;i<n;i++){ const mo=shiftMonth(st,i); const ex=list.find(r=>r.month===mo && !(num(r.paid)>0)); if(ex) ex.amount=a; else list.push({id:uid(),month:mo,amount:a,paid:0}); }

    get(){ readDom(); return list.map(r=>({id:r.id||uid(), month:r.month, amount:num(r.amount), paid:num(r.paid)})).filter(r=>/^\d{4}-\d{2}$/.test(r.month||'') && (r.amount>0||r.paid>0)).sort((a,b)=>a.month.localeCompare(b.month)); },
    setSingleAmount(v){ readDom(); if (list.length===1 && !(num(list[0].paid)>0)){ list[0].amount=v; draw(); } }
  };
}

function debtFacts(d){
  if (d.type==='schedule'){
    const sf=schedFacts(d.schedule);
    return { pmt:sf.dueNow, setPmt:sf.dueNow, remN:sf.unpaid.length, remaining:sf.remaining, outstanding:sf.remaining, paid:sf.paid, total:sf.total,
      eir:0, monthlyRate:0, next:sf.next, overdue:sf.overdue, unpaid:sf.unpaid, done: sf.remaining<=0.5 };
  }
  if (d.type==='addon'){
    const pmt = d.amort>0 ? d.amort : addonPmt(d.principal, d.rate, d.term);
    const remN = Math.max(0, (d.term||0) - (d.paidMonths||0));
    const i = eirFromAddon(d.rate, d.term);
    const pv = remN<=0 ? 0 : (i>0 ? pmt*(1-Math.pow(1+i,-remN))/i : pmt*remN);
    return { pmt, remN, eir:i, remaining: pmt*remN, outstanding: pv, paid: pmt*(d.paidMonths||0),
      totalInterest: pmt*d.term - d.principal, monthlyRate:i, done: remN<=0 };
  }
  const pend = pendingCharges(d.id), bal = Math.max(0, (d.balance||0) + pend), r = (d.rate||0)/100;
  const pmt = d.payment>0 ? d.payment : Math.max(500, bal*0.05);
  return { pmt: Math.min(pmt, bal*(1+r)) || 0, remaining: bal, outstanding: bal, paid: d.paidTotal||0, eir:r, monthlyRate:r,
    interestNow: bal*r, done: bal<=0.5, setPmt: pmt, pending: pend };
}
function planItems(debts){
  const mk=monthKey();
  return debts.map(d=>({d, f:debtFacts(d)})).filter(x=>!x.f.done).map(({d,f})=> d.type==='schedule' ? (()=>{
    const arr=[]; f.unpaid.forEach(e=>{ const k=Math.max(0, monthDiff(mk,e.month)); arr[k]=(arr[k]||0)+e.left; });
    return { id:d.id, name:debtName(d), bal:f.outstanding, rate:0, min:0, sched:Array.from({length:arr.length},(_,i)=>arr[i]||0) }; })() : ({
    id:d.id, name:debtName(d), bal:f.outstanding, rate:f.monthlyRate, min: d.type==='addon' ? f.pmt : (d.payment>0?d.payment:f.setPmt)
  }));
}
function simulate(items, extra=0, strategy='avalanche', rollover=true){
  const L = items.map(x=>({...x})); let m=0, interest=0; const series=[L.reduce((s,x)=>s+x.bal,0)], pays=[], payoff={};
  const base = L.filter(x=>!x.sched).reduce((s,x)=>s+x.min,0) + extra;
  while (L.some(x=>x.bal>0.5) && m<600){
    m++; let paid=0;
    L.forEach(x=>{ if(x.bal>0.5 && !x.sched){ const i=x.bal*x.rate; x.bal+=i; interest+=i; } });
    // Set schedules (pay-later, personal debts) are paid exactly as agreed; extra money goes to the others.
    L.forEach(x=>{ if(x.sched && x.bal>0.5){ const p = m>x.sched.length ? x.bal : Math.min(x.bal, x.sched[m-1]||0); x.bal-=p; paid+=p; } });
    let pool = rollover ? base : L.filter(x=>x.bal>0.5 && !x.sched).reduce((s,x)=>s+x.min,0) + extra;
    L.forEach(x=>{ if(x.bal>0.5 && !x.sched){ const p=Math.min(x.bal,x.min); x.bal-=p; pool-=p; paid+=p; } });
    const order = L.filter(x=>x.bal>0.5 && !x.sched).sort((a,b)=> strategy==='snowball' ? a.bal-b.bal : b.rate-a.rate || a.bal-b.bal);
    for (const x of order){ if (pool<=0.005) break; const p=Math.min(x.bal,pool); x.bal-=p; pool-=p; paid+=p; }
    L.forEach(x=>{ if(x.bal<=0.5 && !payoff[x.id]){ x.bal=0; payoff[x.id]=m; } });
    series.push(L.reduce((s,x)=>s+x.bal,0)); pays.push(paid);
  }
  return { months:m, interest, series, pays, payoff, stuck: m>=600 };
}

/* ---------- storage & sync ----------
   This device keeps a full copy (works offline). It syncs to "Kaban data.json" in the owner's Google Drive:
   - inside the Apps Script page: through google.script.run
   - as the installed app: through the same Apps Script web app's /exec link (POST), protected by a sync passcode. */
const GAS = (typeof google!=='undefined' && google.script && google.script.run) ? google.script.run : null;
const SYNC_KEY = 'kaban.sync';
function syncCfg(){ try{ const c=JSON.parse(localStorage.getItem(SYNC_KEY)||'null'); return c&&c.url&&c.pass ? c : null; }catch(e){ return null; } }
function setSyncCfg(c){ try{ c ? localStorage.setItem(SYNC_KEY, JSON.stringify(c)) : localStorage.removeItem(SYNC_KEY); }catch(e){} }
const canSync = () => !!GAS || !!syncCfg();
const IS_APP = !GAS;
let saveT = null, saving = false, saveAgain = false;
function serverCall(fn, ...args){
  return new Promise((res, rej)=>{ GAS.withSuccessHandler(res).withFailureHandler(rej)[fn](...args); });
}
async function apiCall(action, data, cfg=syncCfg()){
  if (!cfg) throw Object.assign(new Error('Not connected'),{code:'no_cfg'});
  const ctl = new AbortController(); const t=setTimeout(()=>ctl.abort(), 20000);
  try{
    const r = await fetch(cfg.url, { method:'POST', body: JSON.stringify({ action, pass: cfg.pass, data }), redirect:'follow', signal: ctl.signal });
    const txt = await r.text(); let j; try{ j=JSON.parse(txt); }catch(_){ throw Object.assign(new Error('That link didn\'t answer like Kaban. Check it ends in /exec and that "Who has access" is set to Anyone.'),{code:'bad_url'}); }
    if (!j.ok) throw Object.assign(new Error(j.error||'Sync failed'),{code:j.code});
    return j;
  } finally { clearTimeout(t); }
}
async function remoteLoad(){ if (GAS) return serverCall('loadData', syncCfg()?.pass||''); return (await apiCall('load')).data || ''; }
async function remoteSave(json){ if (GAS) return serverCall('saveData', json, syncCfg()?.pass||''); return apiCall('save', json); }
const markPending = on => { try{ on ? localStorage.setItem('kaban.pending','1') : localStorage.removeItem('kaban.pending'); }catch(e){} };
async function pushNow(){
  if (MODE!=='cloud' || !canSync()) return;
  if (!navigator.onLine){ markPending(true); setSync('error'); return; }
  if (saving){ saveAgain = true; return; }
  saving = true; setSync('saving');
  try{ await remoteSave(JSON.stringify(S)); markPending(false); setSync(); }
  catch(err){ markPending(true); setSync('error');
    if (err && (err.code==='wrong_pass'||err.code==='locked')) toast('Your sync passcode was not accepted. Check it in Settings.');
    else toast('Could not reach Google Drive. Your changes are safe on this device and will sync when you\'re back online.'); }
  saving = false;
  if (saveAgain){ saveAgain=false; pushNow(); }
}
function flush(){ markPending(true); clearTimeout(saveT); saveT = setTimeout(pushNow, 600); }
function commit(){
  CHG=null;
  if (MODE==='demo'){ leaveDemo(true); return 'reset'; }
  S.updatedAt = Date.now();
  saveLocal(); flush(); render();
}
function leaveDemo(fromEdit){
  S = { profile: emptyProfile(), debts: [], expenses: {}, extras: {}, transfers: [], receivables: [], oneoffs: {}, updatedAt: Date.now() };
  MODE = canSync() ? 'cloud' : 'local';
  saveLocal(); flush(); setSync(); render();
  if (fromEdit) toast('Example data cleared. Add that entry again — this tracker is now yours.');
}
function adopt(data){
  if (!data || !data.profile) return false;
  S = { profile:{...emptyProfile(), ...data.profile}, debts: data.debts||[], expenses: data.expenses||{}, extras: data.extras||{}, transfers: data.transfers||[], receivables: data.receivables||[], oneoffs: data.oneoffs||{}, updatedAt: data.updatedAt||0 };
  return true;
}

/* ---------- boot ---------- */
async function boot(){
  const local = loadLocal();
  if (local && local.profile){ adopt(local); MODE = canSync() ? 'cloud' : 'local'; } else { S = demoState(); MODE='demo'; }
  render(); setSync(canSync()?'saving':undefined);
  window.addEventListener('online', ()=>{ if (canSync()) pullFromDrive(false); });
  window.addEventListener('offline', ()=>setSync('error'));
  document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible' && canSync()) pullFromDrive(false); });
  if (!canSync()) return;
  await pullFromDrive(true);
}
async function pullFromDrive(first){
  if (!canSync()) return;
  if (!navigator.onLine){ setSync('error'); return; }
  try{
    const txt = await remoteLoad();
    const remote = txt ? JSON.parse(txt) : null;
    if (remote && remote.profile){
      const rU=remote.updatedAt||0, lU=S.updatedAt||0;
      if (MODE==='demo' || !lU || rU>lU){ adopt(remote); MODE='cloud'; saveLocal(); markPending(false); render(); }
      else if (lU>rU && MODE==='cloud') pushNow(); // this device has newer changes
    } else if (MODE==='cloud' && local_has_data()){ pushNow(); }
    setSync();
  }catch(e){ setSync('error');
    if (e && (e.code==='wrong_pass'||e.code==='locked')) toast('Your sync passcode was not accepted. Open Settings to fix it.');
    else if (first) toast('Working offline. Changes will sync to Google Drive when you reconnect.'); }
}
function local_has_data(){ return S.debts.length || S.profile.income.length || Object.keys(S.expenses).length; }
function setSync(state){
  const map = { cloud:['cloud','Synced to your Google Drive'], local:['local', IS_APP?'On this phone only — connect Drive in Settings':'Saved on this device only'], demo:['','Showing example data'], loading:['','Connecting…'] };
  let [cls, txt] = map[MODE] || map.loading;
  if (state==='saving'){ cls=''; txt='Syncing…'; }
  if (state==='error'){ cls='local'; txt='Offline · saved on this device'; }
  const el = $('#sync'); if (el){ el.className = 'sync ' + cls; el.querySelector('span').textContent = txt; }
  const mb = $('.mobile-brand .sync'); if (mb){ mb.className='sync '+cls; mb.querySelector('span').textContent = state==='saving'?'Syncing':state==='error'?'Offline':MODE==='cloud'?'Synced':MODE==='local'?'This phone':'Example'; }
}

async function connectSync(m){
  const url=(m.querySelector('#syUrl').value||'').trim(), pass=m.querySelector('#syPass').value||'', msg=m.querySelector('#syMsg');
  if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url)) { msg.innerHTML='<span class="neg">Paste the Web app link that starts with https://script.google.com and ends in /exec.</span>'; return; }
  if (pass.length<6){ msg.innerHTML='<span class="neg">Use a passcode with at least 6 characters.</span>'; return; }
  msg.textContent='Connecting…';
  const cfg={url, pass};
  try{
    const ping = await apiCall('ping', null, cfg);
    const r = await apiCall('load', null, cfg); const remote = r.data ? JSON.parse(r.data) : null;
    setSyncCfg(cfg);
    const hasLocal = MODE!=='demo' && local_has_data();
    if (remote && remote.profile && hasLocal){
      msg.innerHTML = `<div class="rate-box"><strong>Both this device and your Drive have data.</strong><span class="src">Drive was last updated ${remote.updatedAt?new Date(remote.updatedAt).toLocaleString('en-PH'):'earlier'}. Which one do you want to keep?</span>

      window.__kabanRemote = remote; return;
    }
    if (remote && remote.profile){ adopt(remote); MODE='cloud'; saveLocal(); markPending(false); }
    else { MODE = MODE==='demo' ? 'demo' : 'cloud'; if (MODE==='cloud') await pushNow(); }
    closeModal(); setSync(); render(); toast(ping.created ? 'Connected. Your passcode is set — use the same one on your other devices.' : 'Connected to your Google Drive');
  }catch(e){
    msg.innerHTML = `<span class="neg">${e.code==='wrong_pass'?'That passcode doesn\'t match the one set on your first device.':e.code==='locked'?'Too many wrong tries. Wait 15 minutes and try again.':e.code==='pass_short'?'Use a passcode with at least 6 characters.':e.name==='AbortError'?'The link took too long to answer. Check your internet and try again.':esc(e.message||'Could not connect.')}</span>`;
  }
}

// What a one-time payment toward the debt the plan attacks first would do.
function lumpImpact(amount){
  const items = planItems(S.debts); if (!items.filter(x=>!x.sched).length || amount<=0) return null;
  const strat = S.profile.strategy, extra = num(S.profile.extra);
  const target = items.filter(x=>!x.sched).slice().sort((a,b)=> strat==='snowball' ? a.bal-b.bal : b.rate-a.rate || a.bal-b.bal)[0];
  const before = simulate(items, extra, strat);
  const after = simulate(items.map(x=> x.id===target.id ? {...x, bal: Math.max(0, x.bal-amount)} : x), extra, strat);
  return { target: S.debts.find(d=>d.id===target.id), saved: Math.max(0, before.interest-after.interest), sooner: Math.max(0, before.months-after.months), cleared: amount>=target.bal-0.5, stuck: before.stuck };
}

const ACCT_TYPES = [

];

const accts = () => (S && S.profile && Array.isArray(S.profile.accounts)) ? S.profile.accounts : [];
const acctById = id => accts().find(a=>a.id===id);
const acctType = a => ACCT_TYPES.find(t=>t.id===(a&&a.type)) || ACCT_TYPES[5];
const acctName = id => acctById(id)?.name || '';
function allExpenses(){ const out=[]; for (const k in S.expenses) out.push(...S.expenses[k]); return out; }
function allInflows(){ const out=[]; for (const k in (S.extras||{})) out.push(...S.extras[k]); return out; }
function acctBalance(a){
  let b = num(a.opening);
  allInflows().forEach(x=>{ if (x.acct===a.id) b += num(x.amount); });
  allExpenses().forEach(x=>{ if (x.acct===a.id) b -= num(x.amount); });
  (S.transfers||[]).forEach(t=>{ if (t.to===a.id) b += num(t.amount); if (t.from===a.id) b -= num(t.amount); });
  return b;
}
function moneyTotals(){
  let total=0, spend=0, saved=0;
  accts().forEach(a=>{ const b=acctBalance(a); total+=b; if (acctType(a).spend) spend+=b; else saved+=b; });
  return { total, spend, saved };
}
const defaultAcct = () => { const d=S.profile.defaultAcct; return acctById(d) ? d : (accts()[0]?.id || ''); };
const acctOptions = (sel, none='Not tracked') => `<option value="">${esc(none)}</option>` + accts().map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)} · ${peso(acctBalance(a))}</option>`).join('');
function acctActivity(id, limit=20){
  const rows=[];
  allExpenses().forEach(e=>{ if(!id ? e.acct : e.acct===id) rows.push({date:e.date, amt:-num(e.amount), title:e.note||catById(e.cat).name, meta:catById(e.cat).name, acct:e.acct, kind:'exp', id:e.id}); });
  allInflows().forEach(x=>{ if(!id ? x.acct : x.acct===id) rows.push({date:x.date, amt:num(x.amount), title:x.note||(x.kind==='salary'?'Salary / regular pay':srcName(x.source)), meta:x.kind==='salary'?'Regular income':x.kind==='collect'?'Pautang collected':srcName(x.source), acct:x.acct, kind:'in', id:x.id}); });
  (S.transfers||[]).forEach(t=>{
    if (t.from && (!id || t.from===id)) rows.push({date:t.date, amt:-num(t.amount), title:t.to?`To ${acctName(t.to)}`:(t.note||'Balance correction'), meta:t.to?(t.fee?`Transfer · ${peso(num(t.fee))} fee`:'Transfer'):'Adjustment', acct:t.from, kind:'tr', id:t.id});

function wireFee(m, id, fromSel){
  const inp=m.querySelector('#'+id), box=m.querySelector(`[data-feepicks="${id}"]`); if(!inp||!box) return;
  const mark=()=>box.querySelectorAll('[data-fee]').forEach(b=>{ const on=inp.value!=='' && num(inp.value)===+b.dataset.fee; b.className='chip '+(on?'good':'neutral'); });
  box.querySelectorAll('[data-fee]').forEach(b=>b.onclick=()=>{ inp.value=b.dataset.fee; mark(); inp.dispatchEvent(new Event('input')); });
  inp.addEventListener('input', mark);
  if (fromSel) fromSel.addEventListener('change',()=>{ const a=acctById(fromSel.value); inp.value = a&&a.lastFee!=null ? a.lastFee : ''; mark(); inp.dispatchEvent(new Event('input')); });
  mark();
}

/* ---------- actual pay vs expected (expected is only for planning) ---------- */
const salaryEntries = key => ((S.extras && S.extras[key]) || []).filter(e=>e.kind==='salary');
// An income source is paid once a month or on two paydays (e.g. the 15th and 30th).
const incomeParts = x => (x.split && Array.isArray(x.parts) && x.parts.length) ? x.parts : [{day:x.day||0, amount:num(x.amount)}];
const payLabel = (x,i) => incomeParts(x).length>1 ? (incomeParts(x)[i].day ? ordinal(incomeParts(x)[i].day)+' payday' : (i?'2nd':'1st')+' payday') : '';
function incomeStatus(key=monthKey()){
  const src=S.profile.income, ent=salaryEntries(key);
  return src.map((x,si)=>{ const mine=ent.filter(e=>e.incomeId===x.id || (!e.incomeId && si===0)); const ps=incomeParts(x);
    const received=mine.reduce((s,e)=>s+num(e.amount),0), expected=ps.reduce((s,p)=>s+num(p.amount),0);
    if (ps.length>1){
      const parts=ps.map((p,i)=>{ const pe=mine.filter(e=>(e.part||0)===i); const got=pe.reduce((s,e)=>s+num(e.amount),0); return { i, day:+p.day||0, expected:num(p.amount), received:got, logged:pe.length>0, entries:pe }; });
      const effective=parts.reduce((s,p)=>s+(p.logged?p.received:p.expected),0);
      return { src:x, split:true, parts, expected, received, final: parts.every(p=>p.logged), effective };
    }
    const final=mine.some(e=>e.final);
    return { src:x, split:false, parts:[{i:0, day:+ps[0].day||0, expected, received, logged:mine.length>0, entries:mine}], expected, received, final, effective: final ? received : Math.max(received, expected) }; });
}
// Income to plan this month with: what actually came in for finished paydays, expected for the rest.
const incomeTotalExpected = () => S.profile.income.reduce((s,x)=>s+incomeParts(x).reduce((a,p)=>a+num(p.amount),0),0);
const effectiveIncome = (key=monthKey()) => incomeStatus(key).reduce((s,x)=>s+x.effective,0) + (S.profile.income.length?0:salaryEntries(key).reduce((s,e)=>s+num(e.amount),0));
const receivedIncome = (key=monthKey()) => salaryEntries(key).reduce((s,e)=>s+num(e.amount),0);
function logPayModal(incomeId, part){ extraModal(null, {kind:'salary', incomeId, part}); }

/* ---------- this month: what to pay, what's paid, am I over? ---------- */
function debtPaidIn(d, key){
  if (d.monthPaid && d.monthPaid[key]!=null) return num(d.monthPaid[key]);
  return monthExp(key).filter(e=>e.debtId===d.id).reduce((s,e)=>s+num(e.amount),0);
}
function monthChecklist(key=monthKey()){
  const items=[];
  S.profile.bills.filter(b=>billDueIn(b,key)).forEach(b=>billParts(b).forEach((p,i)=>{
    if (b.transfer){ const tr=moveTransfers(b,i,key), moved=tr.reduce((s,t)=>s+num(t.amount),0);
      items.push({ kind:'move', every:billEvery(b), id:b.id, part:i, name:b.name+(partLabel(b,i)?' · '+partLabel(b,i):''), day:+p.day||0, expected:num(p.amount), paid:moved, done:tr.length>0, to: tr.length?tr[tr.length-1].to:(b.toAcct||''), from:b.payFrom||'', trId:tr[tr.length-1]?.id }); return; }
    const paidE=monthExp(key).filter(e=>e.billId===b.id && (e.part||0)===i); const paid=paidE.reduce((s,e)=>s+num(e.amount),0);
    items.push({ kind:'bill', every:billEvery(b), id:b.id, part:i, name:b.name+(partLabel(b,i)?' · '+partLabel(b,i):''), day:+p.day||0, expected:num(p.amount), paid, done:paidE.length>0, from:b.payFrom||'', expId:paidE[paidE.length-1]?.id });
  }));
  ((S.oneoffs||{})[key]||[]).forEach(o=>{ const pe=monthExp(key).filter(e=>e.oneoffId===o.id); const paid=pe.reduce((s,e)=>s+num(e.amount),0);
    items.push({ kind:'oneoff', id:o.id, name:o.name, day:+o.day||0, expected:num(o.amount), paid, done:pe.length>0, from:o.payFrom||'', expId:pe[pe.length-1]?.id }); });
  S.debts.forEach(d=>{ const f=debtFacts(d), paid=debtPaidIn(d,key);
    if (f.done && paid<=0) return;
    let expected = d.type==='schedule' ? f.pmt + paid : d.type==='addon' ? f.pmt : (d.payment>0?d.payment:f.setPmt);
    if (expected<=0 && paid<=0) return;
    items.push({ kind:'debt', id:d.id, name:debtName(d), day:+d.dueDay||0, expected, paid, done: paid>=expected-1 || f.done });
  });
  items.sort((a,b)=>(a.done-b.done) || ((a.day||99)-(b.day||99)));
  const spendItems=items.filter(x=>x.kind!=='move'), moves=items.filter(x=>x.kind==='move');
  const toPay=spendItems.filter(x=>!x.done).reduce((s,x)=>s+Math.max(0,x.expected-x.paid),0);
  const paid=spendItems.reduce((s,x)=>s+x.paid,0), planned=spendItems.reduce((s,x)=>s+(x.done?x.paid:Math.max(x.expected,x.paid)),0);
  const toMove=moves.filter(x=>!x.done).reduce((s,x)=>s+x.expected,0);
  return { items, toPay, paid, planned, toMove };
}
function budgetCheck(key=monthKey()){
  const cl=monthChecklist(key), income=effectiveIncome(key)+extraTotal(key), spent=monthSpent(key);
  const debtNotInExp = S.debts.reduce((s,d)=>s+ (d.monthPaid&&d.monthPaid[key]? Math.max(0, num(d.monthPaid[key]) - num((d.monthCovered||{})[key]) - monthExp(key).filter(e=>e.debtId===d.id).reduce((a,e)=>a+num(e.amount),0)) : 0),0);
  const safe = income - spent - debtNotInExp - cl.toPay;
  const now=new Date(), dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(), daysLeft = key===monthKey() ? dim-now.getDate()+1 : dim;
  const sp=spentBy(key), bud=S.profile.budgets||{};
  const overCats = Object.keys(bud).filter(c=>num(bud[c])>0 && (sp[c]||0)>num(bud[c])).map(c=>({c, over:(sp[c]||0)-num(bud[c])}));
  const catRoom = Object.keys(bud).reduce((s,c)=>s+Math.max(0,num(bud[c])-(sp[c]||0)),0);
  const ready = accts().length ? accts().filter(a=>acctType(a).spend||a.type==='allowance').reduce((s,a)=>s+acctBalance(a),0) : null;
  return { cl, income, spent, safe, perDay: safe/daysLeft, daysLeft, overCats, catRoom, ready, freeNow: ready==null?null:ready-cl.toPay };
}

/* ---------- paying with a credit card, Atome or SPayLater ----------
   An expense "charged" to a card has e.charge = debt id instead of e.acct.
   Credit lines: new charges are added on top of the last balance you entered (until you update it from a statement).
   Pay-later apps: a charge adds installment rows to that debt's schedule (fromExp = expense id). */
let CHG = null;
function chargeTotals(){ if (CHG) return CHG; CHG={}; allExpenses().forEach(e=>{ if(!e.charge) return; const c=CHG[e.charge]=CHG[e.charge]||{pending:0,all:0}; c.all+=num(e.amount); if(!e.billed) c.pending+=num(e.amount); }); return CHG; }
const pendingCharges = id => (chargeTotals()[id]?.pending)||0;
const chargeCredit = d => Math.max(0, ((chargeTotals()[d.id]?.all)||0) - num(d.chargeRepaid));
function markBilled(id){ allExpenses().forEach(e=>{ if(e.charge===id) e.billed=true; }); CHG=null; }
const cardDebts = () => S.debts.filter(d=>d.type==='revolving' || (d.type==='schedule' && d.lender!=='person'));
function payOptions(sel, none='Not tracked'){
  const cards=cardDebts();
  return acctOptions(sel, none) + (cards.length?`<optgroup label="Charge to a card / pay later">${cards.map(d=>{ const f=debtFacts(d); const lim=num(d.limit); return `<option value="debt:${d.id}" ${sel==='debt:'+d.id?'selected':''}>${esc(debtName(d))} · ${lim?peso(Math.max(0,lim-f.remaining))+' available':peso(f.remaining)+' owed'}</option>`; }).join('')}</optgroup>`:'');
}
const canPay = () => accts().length || cardDebts().length;
const parseTarget = v => (v||'').startsWith('debt:') ? {charge:v.slice(5)} : (v?{acct:v}:{});
const targetOf = e => e.charge ? 'debt:'+e.charge : (e.acct||'');
const targetName = e => e.charge ? (S.debts.find(d=>d.id===e.charge) ? 'charged to '+debtName(S.debts.find(d=>d.id===e.charge)) : '') : acctName(e.acct);
function attachCharge(e, opts, paidBefore=0){
  const d=S.debts.find(x=>x.id===e.charge); CHG=null; if(!d||d.type!=='schedule') return;
  const n=Math.max(1,+(opts?.n)||1), start=opts?.start||shiftMonth(monthKey(),1), fee=num(opts?.fee), total=num(e.amount)+fee, per=Math.round(total/n*100)/100;
  const rows=[]; for(let i=0;i<n;i++) rows.push({id:uid(), month:shiftMonth(start,i), amount: i===n-1 ? Math.round((total-per*(n-1))*100)/100 : per, paid:0, fromExp:e.id});
  if (paidBefore>0) applyToSched(rows, paidBefore);
  d.schedule=(d.schedule||[]).concat(rows).sort((a,b)=>a.month.localeCompare(b.month)); e.chargeOpts={n,start,fee};
}
// Removes a charge's installments. keepPaid: leave already-paid parts as closed rows (for deletes).
function detachCharge(e, keepPaid){
  CHG=null; if(!e||!e.charge) return 0; const d=S.debts.find(x=>x.id===e.charge); if(!d||d.type!=='schedule') return 0;
  const mine=(d.schedule||[]).filter(r=>r.fromExp===e.id), paid=mine.reduce((s,r)=>s+num(r.paid),0);
  d.schedule=(d.schedule||[]).filter(r=>r.fromExp!==e.id);
  if (keepPaid) mine.filter(r=>num(r.paid)>0).forEach(r=>d.schedule.push({...r, amount:num(r.paid), fromExp:undefined}));
  d.schedule.sort((a,b)=>a.month.localeCompare(b.month)); return paid;
}
function chargeBox(){ return `<div class="charge-opts" hidden style="padding:12px;border-radius:12px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);display:flex;flex-direction:column;gap:8px">

function wireCharge(sel, box, amtEl, init){

function donut(data, size=170){
  const total = data.reduce((s,x)=>s+x.v,0); const r=size/2-14, C=2*Math.PI*r; let off=0;
  const segs = total>0 ? data.map(x=>{ const len=C*x.v/total; const s=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${x.color}" stroke-width="22" stroke-dasharray="${Math.max(0,len-2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"><title>${esc(x.label)}: ${peso(x.v)}</title></circle>`; off+=len; return s; }).join('')
    : `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="22"/>`;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Spending by category">${segs}
    <text x="50%" y="47%" text-anchor="middle" style="fill:var(--ink);font-family:var(--f-display);font-weight:700;font-size:20px">${peso(total)}</text>
    <text x="50%" y="60%" text-anchor="middle" style="fill:var(--ink-3);font-size:11px">spent</text></svg>`;
}
function niceMax(v){ if (v<=0) return 1000; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
const kfmt = v => v>=1e6 ? '₱'+(v/1e6).toFixed(v%1e6?1:0)+'M' : v>=1000 ? '₱'+Math.round(v/1000)+'k' : '₱'+Math.round(v);
function lineChart(series, opts={}){
  const W=640, H=220, L=48, R=14, T=14, B=28; const n=series.length;
  if (n<2) return `<div class="empty">No balance to chart yet.</div>`;
  const max=niceMax(Math.max(...series)); const x=i=>L+(W-L-R)*i/(n-1), y=v=>T+(H-T-B)*(1-v/max);
  const pts=series.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const grid=[0,.25,.5,.75,1].map(t=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(max*t)}" y2="${y(max*t)}"/><text x="${L-8}" y="${y(max*t)+4}" text-anchor="end">${kfmt(max*t)}</text>`).join('');
  const step=Math.max(1,Math.ceil((n-1)/6)); let xt='';
  for(let i=0;i<n;i+=step) xt+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${i===0?'Now':futureLabel(i).replace(' 20',' ’')}</text>`;
  const marks=(opts.marks||[]).map(mk=>`<circle cx="${x(mk.i)}" cy="${y(series[mk.i])}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><title>${esc(mk.label)}</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'Balance over time')}">
    <defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--pine)" stop-opacity=".28"/><stop offset="1" stop-color="var(--pine)" stop-opacity="0"/></linearGradient></defs>
    ${grid}${xt}<polygon points="${x(0)},${y(0)} ${pts} ${x(n-1)},${y(0)}" fill="url(#lg)"/><polyline points="${pts}" fill="none" stroke="var(--pine)" stroke-width="2.5" stroke-linejoin="round"/>${marks}
    <circle cx="${x(n-1)}" cy="${y(series[n-1])}" r="5" fill="var(--good)" stroke="var(--surface)" stroke-width="2"/></svg>`;
}
function stackChart(rows){
  const W=660,H=240,L=48,R=10,T=14,B=30, n=rows.length;
  const max=niceMax(Math.max(...rows.map(r=>Math.max(r.income, r.parts.reduce((s,p)=>s+p.v,0)))));
  const bw=(W-L-R)/n, y=v=>T+(H-T-B)*(1-v/max);
  const grid=[0,.25,.5,.75,1].map(t=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(max*t)}" y2="${y(max*t)}"/><text x="${L-8}" y="${y(max*t)+4}" text-anchor="end">${kfmt(max*t)}</text>`).join('');
  let bars='', inc='';
  rows.forEach((r,i)=>{ let acc=0; const x0=L+i*bw+bw*.18, w=bw*.64;
    r.parts.forEach(p=>{ if(p.v<=0) return; const y1=y(acc+p.v), y0=y(acc); bars+=`<rect x="${x0}" y="${y1}" width="${w}" height="${Math.max(0,y0-y1)}" fill="${p.color}" rx="2"><title>${r.label} · ${p.name}: ${peso(p.v)}</title></rect>`; acc+=p.v; });
    inc+=`<line x1="${L+i*bw+4}" x2="${L+(i+1)*bw-4}" y1="${y(r.income)}" y2="${y(r.income)}" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"><title>${r.label} income: ${peso(r.income)}</title></line>`;
    bars+=`<text x="${L+i*bw+bw/2}" y="${H-10}" text-anchor="middle">${r.short}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="12-month forecast">${grid}${bars}${inc}</svg>`;
}

function greeting(){ const h=new Date().getHours(); return h<12?'Magandang umaga':h<18?'Magandang hapon':'Magandang gabi'; }
function upcoming(){
  const now=new Date(), out=[];
  const dayIn=(y,mo,day)=>new Date(y,mo,Math.min(day,new Date(y,mo+1,0).getDate()));
  const add=(day,name,amt,kind)=>{ if(!day) return; let d=dayIn(now.getFullYear(),now.getMonth(),day); if(d< new Date(now.getFullYear(),now.getMonth(),now.getDate())) d=dayIn(now.getFullYear(),now.getMonth()+1,day); const days=Math.round((d-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5); out.push({d,days,name,amt,kind}); };
  const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const addMonth=(key,day,name,amt,kind)=>{ const [y,mo]=key.split('-').map(Number); const dt=new Date(y,mo-1, day?Math.min(day,new Date(y,mo,0).getDate()):new Date(y,mo,0).getDate()); const days=Math.round((dt-t0)/864e5); if(days<=45) out.push({d:dt,days,name,amt,kind}); };
  activeDebts().filter(d=>d.type==='schedule').forEach(d=>debtFacts(d).unpaid.slice(0,2).forEach(e=>addMonth(e.month,+d.dueDay,debtName(d),e.left,'debt')));
  recList().forEach(r=>{ const rf=schedFacts(r.schedule); rf.unpaid.slice(0,1).forEach(e=>addMonth(e.month,+r.day,'Singilin: '+r.name,e.left,'collect')); });
  activeDebts().filter(d=>d.type!=='schedule').forEach(d=>{ const f=debtFacts(d); add(+d.dueDay, debtName(d), d.type==='addon'?f.pmt:(d.payment||f.setPmt), 'debt'); });
  incomeStatus().forEach(st=>st.parts.forEach(p=>{ if (p.day && !p.logged) add(p.day, 'Payday: '+st.src.name, p.expected, 'payday'); }));
  S.profile.bills.filter(b=>billEvery(b)>1).forEach(b=>{ const nk=billNextDue(b, billDueIn(b)&&billPartPaid(b,0)?shiftMonth(monthKey(),1):monthKey()); addMonth(nk, +b.day, b.name+' ('+FREQ_LABEL[billEvery(b)].toLowerCase()+')', billAmount(b), 'bill'); });
  S.profile.bills.filter(b=>billEvery(b)===1).forEach(b=>billParts(b).forEach((p,i)=>{ if(!billPartPaid(b,i)||new Date().getDate()<+p.day) add(+p.day, b.name + (partLabel(b,i)?' · '+partLabel(b,i):''), num(p.amount), 'bill'); }));
  return out.sort((a,b)=>a.days-b.days).slice(0,7);
}
function insights(){
  const out=[]; const inc=incomeTotal(); const T=debtTotals(); const act=activeDebts();
  if (inc>0 && T.monthly>0){ const dti=T.monthly/inc*100;
    out.push(dti>40?{k:'bad',t:`Debt payments take ${pct(dti,0)} of your income`,p:'Above 40% is a danger zone. Pause new borrowing and point every spare peso at the plan.'}
      : dti>30?{k:'warn',t:`Debt payments take ${pct(dti,0)} of your income`,p:'Aim to bring this under 30%. Each loan you finish frees its amortization for the next one.'}
      : {k:'good',t:`Debt payments take ${pct(dti,0)} of your income`,p:'That is a manageable level. Keep it there by not opening new credit lines.'}); }
  act.filter(d=>d.type==='schedule').forEach(d=>{ const f=debtFacts(d); if (f.overdue.length) out.push({k:'bad',t:`${debtName(d)} has an overdue payment`,p:`${peso(f.overdue.reduce((s,e)=>s+e.left,0))} from ${monthLabel(f.overdue[0].month,true)} is still unpaid.${d.lender!=='person'?' Pay-later apps add late fees, so settle it first.':''}`}); });
  recList().forEach(r=>{ const rf=schedFacts(r.schedule); if (rf.overdue.length) out.push({k:'warn',t:`Time to singil ${r.name}`,p:`${peso(rf.overdue.reduce((s,e)=>s+e.left,0))} was due back in ${monthLabel(rf.overdue[0].month,true)}.`}); });
  const rev = act.filter(d=>d.type==='revolving');
  rev.forEach(d=>{ const f=debtFacts(d); const p=d.payment||f.setPmt; if (p <= f.interestNow*1.25) out.push({k:'bad',t:`${debtName(d)} barely shrinks`,p:`About ${peso(f.interestNow)} of your ${peso(p)} payment goes to interest each month. Pay more here or move it to a lower-rate loan.`}); });
  const top = act.map(d=>({d,f:debtFacts(d)})).sort((a,b)=>b.f.monthlyRate-a.f.monthlyRate)[0];
  if (top && act.length>1) out.push({k:'tip',t:`Highest true rate: ${debtName(top.d)}`,p:`Its effective rate is about ${pct(top.f.monthlyRate*100)} a month (${pct(top.f.monthlyRate*1200,0)} a year). Any extra money saves the most here.`});
  const ub = eirFromAddon(1.29, 24)*100;
  const pricey = act.filter(d=>debtFacts(d).monthlyRate*100 > ub+0.4);
  if (pricey.length>=2){ const amt=pricey.reduce((s,d)=>s+debtFacts(d).outstanding,0); out.push({k:'tip',t:'Consolidation could lower your cost',p:`${pricey.length} debts (${peso(amt)}) cost more than a UnionBank-type loan at about ${pct(ub)} effective a month. Test it on the Payoff plan page.`}); }

  return out.slice(0,5);
}
function vOverview(){

  const r=56, C=2*Math.PI*r;

function vBudget(){
  const inc=incomeTotal(), bills=billsTotal(), T=debtTotals(), mk=monthKey(), sp=spentBy(mk), bud=S.profile.budgets||{};
  const btot=budgetTotal(); const left = effectiveIncome(mk)+extraTotal(mk)-bills-T.monthly-btot;
  const needs = bills + allCats().filter(c=>isNeed(c.id)).reduce((s,c)=>s+num(bud[c.id]),0);
  const wants = allCats().filter(c=>!isNeed(c.id) && c.id!=='savings' && c.id!=='debtpay').reduce((s,c)=>s+num(bud[c.id]),0);
  const save = T.monthly + num(bud.savings) + num(S.profile.extra) + Math.max(0,left - num(S.profile.extra));
  const rule = (label, val, target, color) => { const p=inc?val/inc*100:0; return `<div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;gap:8px"><strong>${label}</strong><span class="num">${pct(p,0)} <span class="faint">/ ${target}%</span></span></div><div class="bar ${p>target+5&&label!=='Debt & savings'?'over':''}"><i style="width:${Math.min(100,p)}%;background:${color}"></i></div><span class="faint small num">${peso(val)} of ${peso(inc*target/100)} guide</span></div>`; };
  const budgetCats = BASE_CATS.filter(c=>!['housing','bills','load','debtpay'].includes(c.id) || num(bud[c.id])>0);
  return `
  <div class="topbar"><div><div class="eyebrow">Monthly plan</div><h1>Budget</h1><div class="sub muted">Give every peso a job before the month starts.</div></div></div>

function linkedChip(d){
  if (!d.linkId) return '';
  const sibs = S.debts.filter(x=>x.linkId===d.linkId);
  if (sibs.length<2) return '';
  const tot = sibs.filter(x=>!debtFacts(x).done).reduce((s,x)=>{ const f=debtFacts(x); return s + (x.type==='addon'?f.pmt:(x.payment||f.setPmt)); },0);
  return `<span class="chip gold" style="margin-top:6px">Same card · ${peso(tot)}/mo combined</span>`;
}

function consolidationPanel(){
  const act = activeDebts().filter(d=>d.type!=='schedule'); if (!act.length) return '';
  if (!CONS.picked) CONS.picked = act.filter(d=>debtFacts(d).monthlyRate*100 > eirFromAddon(CONS.rate,CONS.term)*100).map(d=>d.id);
  const sel = act.filter(d=>CONS.picked.includes(d.id));
  const items = planItems(sel); const P = items.reduce((s,x)=>s+x.bal,0);
  const cur = simulate(items,0,'avalanche',false); const curMonthly = items.reduce((s,x)=>s+x.min,0);
  const feeAmt = P*CONS.fee/100; const loanP = P + feeAmt;
  const newPmt = addonPmt(loanP, CONS.rate, CONS.term); const newInt = newPmt*CONS.term - P; const eir=eirFromAddon(CONS.rate,CONS.term);
  const save = cur.interest - newInt;
  const verdict = !sel.length ? `<span class="faint">Pick at least one debt to test.</span>`
    : cur.stuck ? `<span class="chip good">Worth it</span> Your current payments on these never finish them. A fixed loan gives you an end date of <strong>${futureLabel(CONS.term)}</strong>.`
    : save>0 ? `<span class="chip good">Saves ${peso(save)}</span> in interest${newPmt<curMonthly?` and lowers your monthly payment by <strong>${peso(curMonthly-newPmt)}</strong>`:`, but your monthly payment rises by <strong>${peso(newPmt-curMonthly)}</strong>`}. Close the old accounts once paid so the balances don't come back.`
    : `<span class="chip bad">Costs ${peso(-save)} more</span> Consolidating these at this rate and term is more expensive. Try a shorter term or leave out the cheaper debts.`;
  const lenderOpts = Object.entries(LENDERS).flatMap(([k,L])=>Object.entries(L.products).filter(([,p])=>p.type==='addon').map(([pk,p])=>`<option value="${k}:${pk}" ${CONS.lender===k+':'+pk||CONS.lender===k&&pk==='pl'?'selected':''}>${esc(L.label)}${Object.keys(L.products).length>1?' · '+esc(p.label):''} (${pct(p.rate)})</option>`)).join('');
  return `<div class="panel span-12"><div class="panel-head"><h2>Debt consolidation tester</h2><span class="faint small">Would one new loan beat what you have?</span></div>
    <div class="panels" style="gap:20px">
      <div class="span-5" style="display:flex;flex-direction:column;gap:12px">
        <span class="eyebrow">Debts to combine</span>
        <div class="list">${act.map(d=>{ const f=debtFacts(d); return `<label class="row" style="cursor:pointer"><input type="checkbox" data-cons="${d.id}" ${CONS.picked.includes(d.id)?'checked':''} style="width:18px;height:18px;accent-color:var(--pine)"><span class="grow title">${esc(debtName(d))}</span><span class="small faint num">${pct(f.monthlyRate*100)}</span><span class="amount small">${peso(f.outstanding)}</span></label>`; }).join('')}</div>
      </div>
      <div class="span-7" style="display:flex;flex-direction:column;gap:14px">
        <div class="grid-form">
          <label class="field" style="grid-column:1/-1">New loan from<select class="input" id="consLender">${lenderOpts}</select></label>
          <label class="field">Add-on rate / month<div class="input-wrap"><input class="input num" id="consRate" style="padding-left:12px" value="${CONS.rate}" inputmode="decimal"><span class="suffix">%</span></div></label>
          <label class="field">Term<div class="input-wrap"><input class="input num" id="consTerm" style="padding-left:12px" value="${CONS.term}" inputmode="numeric"><span class="suffix">months</span></div></label>
          <label class="field">Processing fee<div class="input-wrap"><input class="input num" id="consFee" style="padding-left:12px" value="${CONS.fee}" inputmode="decimal"><span class="suffix">%</span></div></label>
        </div>
        <div class="calc">
          <div><span>Loan needed</span><strong>${peso(loanP)}</strong></div>
          <div><span>New monthly</span><strong>${peso(newPmt,2)}</strong></div>
          <div><span>Now paying</span><strong>${peso(curMonthly)}</strong></div>
          <div><span>Effective rate</span><strong>${pct(eir*100)}/mo</strong></div>
          <div><span>New interest</span><strong>${peso(newInt)}</strong></div>
          <div><span>Current path interest</span><strong>${cur.stuck?'No end':peso(cur.interest)}</strong></div>
        </div>
        <div style="line-height:1.7">${verdict}</div>
      </div>
    </div></div>`;
}

function vForecast(){
  const plan=currentPlan(), inc=incomeTotal();
  const hist=[1,2,3].map(k=>shiftMonth(monthKey(),-k)).filter(k=>monthExp(k).length);
  const avgVar = hist.length ? hist.reduce((s,k)=>s+monthExp(k).filter(e=>!['housing','bills','load','debtpay'].includes(e.cat)).reduce((a,e)=>a+num(e.amount),0),0)/hist.length : 0;
  const varSpend = budgetTotal() || avgVar;
  const rows = Array.from({length:12},(_,i)=>{ const debt = plan.pays[i] || 0; const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+i);
    const bills = billsDueTotal(monthKey(d));
    return { label:`${MONTHS[d.getMonth()]} ${d.getFullYear()}`, short:MONTHS[d.getMonth()], income:inc + (i===0?extraTotal(monthKey()):0), debt, bills, spend:varSpend,
      parts:[{name:'Bills',v:bills,color:'var(--c3)'},{name:'Debt payments',v:debt,color:'var(--c2)'},{name:'Spending',v:varSpend,color:'var(--c1)'}] }; });
  const ends = Object.entries(plan.payoff).filter(([,m])=>m<=12).map(([id,m])=>({d:S.debts.find(x=>x.id===id),m}));
  const yearNet = rows.reduce((s,r)=>s+r.income-r.bills-r.debt-r.spend,0);
  return `
  <div class="topbar"><div><div class="eyebrow">Next 12 months</div><h1>Forecast</h1><div class="sub muted">Projected spending using your bills, budgets and payoff plan.</div></div></div>
  <div class="panels">
    <div class="panel span-4 kpi"><span class="eyebrow">Projected monthly outflow</span><span class="val num">${peso(rows[0].bills+rows[0].debt+rows[0].spend)}</span><span class="foot">this month</span></div>
    <div class="panel span-4 kpi"><span class="eyebrow">12-month surplus</span><span class="val num ${yearNet<0?'neg':'pos'}">${inc?peso(yearNet):'—'}</span><span class="foot">${inc?'income minus all projected outflow':'Add income on the Budget page'}</span></div>
    <div class="panel span-4 kpi"><span class="eyebrow">Spending basis</span><span class="val" style="font-size:1.15rem">${budgetTotal()?'Your budgets':hist.length?'Average of last '+hist.length+' mo':'Not set'}</span><span class="foot">${peso(varSpend)} a month of day-to-day spending</span></div>
    <div class="panel span-12"><div class="panel-head"><h2>Money in vs money out</h2></div>
      <div class="scroll-x">${stackChart(rows)}</div>
      <div class="legend"><span><span class="dot" style="background:var(--c3)"></span>Fixed bills</span><span><span class="dot" style="background:var(--c2)"></span>Debt payments (with extra)</span><span><span class="dot" style="background:var(--c1)"></span>Day-to-day spending</span><span><span style="width:14px;height:3px;background:var(--ink);border-radius:2px;display:inline-block"></span>Income</span></div>
    </div>
    <div class="panel span-8"><div class="panel-head"><h2>Month by month</h2></div>
      <div class="scroll-x"><table class="t"><thead><tr><th>Month</th><th class="r">Income</th><th class="r">Bills</th><th class="r">Debt</th><th class="r">Spending</th><th class="r">Left over</th></tr></thead><tbody>
      ${rows.map(r=>{ const net=r.income-r.bills-r.debt-r.spend; return `<tr><td>${r.label}</td><td class="r">${peso(r.income)}</td><td class="r">${peso(r.bills)}</td><td class="r">${peso(r.debt)}</td><td class="r">${peso(r.spend)}</td><td class="r"><strong class="${net<0?'neg':'pos'}">${peso(net)}</strong></td></tr>`; }).join('')}
      </tbody></table></div></div>
    <div class="panel span-4"><div class="panel-head"><h2>Milestones ahead</h2></div>
      ${ends.length?`<div class="list">${ends.sort((a,b)=>a.m-b.m).map(e=>{ const f=debtFacts(e.d); return `<div class="row"><div class="cat-ico" style="background:var(--good-soft);color:var(--good)">${ico('trophy','style="width:18px;height:18px"')}</div><div class="grow"><div class="title">${esc(debtName(e.d))}</div><div class="meta">Paid off ${payoffLabel(e.m)}</div></div><span class="amount pos small">+${peso(e.d.type==='addon'?f.pmt:(e.d.payment||f.setPmt))}/mo</span></div>`; }).join('')}</div><p class="faint small">Each finished debt frees its payment. Under your plan it rolls into the next debt until you're clear.</p>`:`<div class="empty">No debts finish within 12 months at the current plan. Add an extra payment on the Payoff plan page to bring one closer.</div>`}
    </div>
  </div>`;
}

function openModal(html, onMount){
  const root=$('#modalRoot'); root.innerHTML=`<div class="scrim" data-scrim><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const first=root.querySelector('input,select,textarea'); if(first) setTimeout(()=>first.focus(),30);
  onMount && onMount(root.querySelector('.modal'));
}
function closeModal(){ $('#modalRoot').innerHTML=''; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
document.addEventListener('mousedown', e=>{ if(e.target.matches('[data-scrim]')) closeModal(); });
const mhead = t => `<div class="modal-head"><h2>${t}</h2><button class="icon-btn" data-act="close" aria-label="Close">${ico('x')}</button></div>`;

    m.querySelector('#expForm').onsubmit=e=>{ e.preventDefault(); const amt=num($('#eAmt').value); if(amt<=0) return toast('Enter an amount above zero.');
      const rec={ id: ex?ex.id:uid(), amount:amt, date:$('#eDate').value||today(), cat:$('#eCat').value, note:$('#eNote').value.trim(), ...parseTarget($('#eAcct').value), ...(ex&&ex.billId?{billId:ex.billId,part:ex.part||0}:{}), ...(ex&&ex.oneoffId?{oneoffId:ex.oneoffId}:{}), ...(ex&&ex.charge&&ex.billed&&ex.charge===parseTarget($('#eAcct').value).charge?{billed:true}:{}), ...(ex&&ex.debtId?{debtId:ex.debtId}:{}) };
      if (commitCheck()) return;
      const names=[]; let paidBefore=0; if(ex){ paidBefore=detachCharge(ex,false); S.expenses[key]=S.expenses[key].filter(x=>x.id!==ex.id); names.push('exp-'+key); }
      const nk=rec.date.slice(0,7); (S.expenses[nk]=S.expenses[nk]||[]).push(rec); names.push('exp-'+nk);
      if (rec.charge) attachCharge(rec, eco.get(), paidBefore);
      closeModal(); commit(...new Set(names)); toast(ex?'Expense updated':'Expense added'); };
  });

   </form>`, m=>{
    const q=s=>m.querySelector(s);
    const showTotal=()=>{ const t=num(q('#iA0').value)+num(q('#iA1').value); q('#iTotal').textContent = t>0 ? `Expected per month: ${peso(t)}` : ''; };
    ['#iA0','#iA1'].forEach(x=>q(x).addEventListener('input',showTotal)); showTotal();

      const want=bt.dataset.freq==='2'; if(want===split) return; split=want;
      m.querySelectorAll('#iFreq [data-freq]').forEach(x=>x.setAttribute('aria-pressed',x===bt));
      if (split && !q('#iA0').value && num(q('#sAmt').value)>0){ const t=num(q('#sAmt').value), h=Math.round(t/2*100)/100; q('#iA0').value=h; q('#iA1').value=Math.round((t-h)*100)/100; if(!q('#iD0').value) q('#iD0').value=15; if(!q('#iD1').value) q('#iD1').value=30; }

      q('#iOnce').hidden=split; q('#iTwice').hidden=!split; showTotal(); });
    q('#sForm').onsubmit=e=>{ e.preventDefault();
      const rec={ id: it?it.id:uid(), name:q('#sName').value.trim() };

        if (p.some(x=>x.amount<=0)) return toast('Enter the expected amount for both paydays.');
        if (p.some(x=>!x.day)) return toast('Enter both paydays, like 15 and 30.');
        p.sort((a,b)=>a.day-b.day); Object.assign(rec,{ split:true, parts:p, amount:p[0].amount+p[1].amount, day:p[0].day });

      closeModal(); commit('profile'); toast(split?`${rec.name}: paydays on the ${ordinal(rec.parts[0].day)} and ${ordinal(rec.parts[1].day)}`:'Income saved'); };
  });
}

/* A bill is paid once a month or split into two payments (e.g. 7th and 20th). */
/* How often a bill repeats: every 1 (monthly), 3 (quarterly), 6 (semi-annual) or 12 (yearly) months. */
const billEvery = b => Math.max(1, +b.every || 1);
const FREQ_LABEL = {1:'Monthly',3:'Every 3 months',6:'Every 6 months',12:'Yearly'};
function billDueIn(b, key=monthKey()){ const ev=billEvery(b); if (ev===1) return true; const st=b.start||monthKey(); const d=monthDiff(st,key); return ((d%ev)+ev)%ev===0; }
function billNextDue(b, from=monthKey()){ for (let i=0;i<=12;i++){ const k=shiftMonth(from,i); if (billDueIn(b,k)) return k; } return from; }
const billAmount = b => billParts(b).reduce((a,p)=>a+num(p.amount),0);
const billMonthly = b => billAmount(b)/billEvery(b);
const billsDueTotal = key => S.profile.bills.filter(b=>!b.transfer && billDueIn(b,key)).reduce((s,b)=>s+billAmount(b),0);
const billParts = b => (b.split && Array.isArray(b.parts) && b.parts.length) ? b.parts : [{day:b.day||0, amount:num(b.amount)}];
const partLabel = (b,i) => billParts(b).length>1 ? (i===0?'1st payment':'2nd payment') : '';
const moveTransfers = (b,i,key=monthKey()) => (S.transfers||[]).filter(t=>t.billId===b.id && (t.part||0)===i && (t.date||'').startsWith(key));
const billPartPaid = (b,i,key=monthKey()) => b.transfer ? moveTransfers(b,i,key).length>0 : monthExp(key).some(e=>e.billId===b.id && (e.part||0)===i);

    const everyUI=()=>{ const ev=+q('#sEvery').value; q('#sStartWrap').hidden = !(ev>2); q('#sAmtLbl').textContent = ev>2?'Amount each time':'Monthly amount';
      q('#sSetAside').textContent = ev>2 && num(q('#sAmt').value)>0 ? `Set aside about ${peso(num(q('#sAmt').value)/ev)} a month so it's ready when it's due.` : ''; };
    q('#sAmt').addEventListener('input', everyUI); everyUI();
    q('#sEvery').addEventListener('change',()=>{ everyUI(); const want = q('#sEvery').value==='2'; if (want===split) return; split=want;
      if (split && !q('#sA0').value && num(q('#sAmt').value)>0){ const h=num(q('#sAmt').value)/2; q('#sA0').value=h; q('#sA1').value=h; if(q('#sDay').value) q('#sD0').value=q('#sDay').value; }
      if (!split && !q('#sAmt').value){ const t=num(q('#sA0').value)+num(q('#sA1').value); if(t) q('#sAmt').value=t; if(q('#sD0').value) q('#sDay').value=q('#sD0').value; }
      q('#sOnce').hidden=split; q('#sTwice').hidden=!split; showTotal();
    });
    q('#sHalf').onclick=()=>{ const box=q('#sHalfBox'); if(box){ box.remove(); return; }
      q('#sHalf').insertAdjacentHTML('afterend',`<div id="sHalfBox" class="grid-form" style="align-items:end"><label class="field">Monthly total<div class="input-wrap"><span class="prefix">₱</span><input class="input num" id="sHT" inputmode="decimal"></div></label><button type="button" class="btn sm" id="sHGo">Fill both payments</button></div>`);
      q('#sHT').focus(); q('#sHGo').onclick=()=>{ const t=num(q('#sHT').value); if(t>0){ const h=Math.round(t/2*100)/100; q('#sA0').value=h; q('#sA1').value=Math.round((t-h)*100)/100; showTotal(); q('#sHalfBox').remove(); } }; };
    ['#sA0','#sA1'].forEach(s=>q(s).addEventListener('input',showTotal));
    q('#sForm').onsubmit=e=>{ e.preventDefault();
      const rec={ id: it?it.id:uid(), name:q('#sName').value.trim(), cat:q('#sCat').value, payFrom:q('#sFrom')?.value||'', ...(q('#sMove').checked?{transfer:true, toAcct:q('#sTo').value||''}:{}) };
      if (split){
        const p=[0,1].map(i=>({day:Math.min(31,Math.max(0,+q('#sD'+i).value||0)), amount:num(q('#sA'+i).value)}));
        if (p.some(x=>x.amount<=0)) return toast('Enter an amount for both payments.');
        if (p.some(x=>!x.day)) return toast('Enter the day for both payments, like 7 and 20.');
        p.sort((a,b)=>a.day-b.day);
        Object.assign(rec,{ split:true, parts:p, amount:p[0].amount+p[1].amount, day:p[0].day });
      } else {
        const amt=num(q('#sAmt').value); if (amt<=0) return toast('Enter the monthly amount.');
        Object.assign(rec,{ amount:amt, day:+q('#sDay').value||0 });
      }
      const ev=+q('#sEvery').value; if (!split && ev>2){ rec.every=ev; rec.start=q('#sStart').value||monthKey(); }
      if (commitCheck()) return;
      const list=S.profile.bills; if(it) list.splice(list.findIndex(x=>x.id===it.id),1,rec); else list.push(rec);
      closeModal(); commit('profile'); toast(split?`${rec.name} set for the ${ordinal(rec.parts[0].day)} and ${ordinal(rec.parts[1].day)}`:rec.every>1?`${rec.name}: ${FREQ_LABEL[rec.every].toLowerCase()}, next due ${monthLabel(rec.start,true)}`:'Bill saved'); };
  });
}
